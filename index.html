function minXfers(bals){const ts=[],ds=bals.filter(b=>b.amt<-0.5).map(b=>({...b})),cs=bals.filter(b=>b.amt>0.5).map(b=>({...b}));while(ds.length&&cs.length){const d=ds[0],c=cs[0],a=Math.min(-d.amt,c.amt);if(a>0.5)ts.push({from:d.name,to:c.name,a});d.amt+=a;c.amt-=a;if(Math.abs(d.amt)<0.5)ds.shift();if(Math.abs(c.amt)<0.5)cs.shift();}return ts;}
function pStats(pid){const cl=APP.sessions.filter(s=>s.status==='closed');let sess=0,buyins=0,profit=0,wins=0,best=-Infinity,worst=Infinity;const res=[];for(const s of cl){const e=(s.entries||[]).find(e=>e.pid===pid);if(!e)continue;sess++;buyins+=eTB(e);const p=eP(e);if(p!==null){profit+=p;if(p>best)best=p;if(p<worst)worst=p;if(p>0)wins++;res.push(p>0?'W':'L');}}let streak=0,lastR=null;for(let i=res.length-1;i>=0;i--){if(i===res.length-1){streak=1;lastR=res[i];}else if(res[i]===lastR)streak++;else break;}return{sess,buyins,profit,wins,wr:sess?Math.round(wins/sess*100):0,ab:sess?Math.round(buyins/sess):0,ap:sess?Math.round(profit/sess):0,best:best===-Infinity?0:best,worst:worst===Infinity?0:worst,streak,lastR};}
function hStats(){const cl=APP.sessions.filter(s=>s.status==='closed');return{rake:cl.reduce((s,ss)=>s+(parseFloat(ss.rake)||0),0),exp:APP.sessions.reduce((s,ss)=>s+(ss.expenses||[]).reduce((a,e)=>a+(parseFloat(e.amount)||0),0),0),sess:cl.length,players:APP.players.filter(p=>p.on).length};}
function getFish(s){let sh=null,fi=null,shP=-Infinity,fiP=Infinity;for(const e of(s.entries||[])){const p=eP(e);if(p===null)continue;if(p>shP){shP=p;sh=e.pid;}if(p<fiP){fiP=p;fi=e.pid;}}return{sh,fi,shP,fiP};}
function avgStk(s){const w=(s.entries||[]).filter(e=>e.stack!==null&&e.stack!==undefined&&e.stack!=='');if(!w.length)return null;return Math.round(w.reduce((s,e)=>s+parseFloat(e.stack),0)/w.length);}

async function submitPin(){
  if(pinMode==='check'){
    const byP=APP.players.find(p=>p.on&&p.playerPin&&p.playerPin===pinBuf);
    if(byP){myPid=byP.id;access='player';unlockPlayer();return;}
    if(APP.settings.hostPin&&pinBuf===APP.settings.hostPin){access='host';unlockHost();return;}
    if(APP.settings.playerPin&&pinBuf===APP.settings.playerPin){showWhoAreYou();return;}
    if(!APP.settings.hostPin&&!APP.settings.playerPin){pinCtx='host';startPinSet('Set host PIN','First time — you will set a player PIN next');return;}
    pinErr('Wrong PIN');pinBuf='';updDots();
  }else if(pinMode==='set1'){pinFirst=pinBuf;pinBuf='';updDots();pinMode='set2';document.getElementById('plbl').textContent='Confirm PIN';}
  else if(pinMode==='set2'){if(pinBuf===pinFirst){await doPinSet(pinBuf);}else{pinErr("PINs didn't match");pinBuf='';pinFirst='';startPinSet(pinCtx==='host'?'Set host PIN':'Set player PIN','');}}
}

async function doPinSet(pin){
  if(pinCtx==='host'){APP.settings.hostPin=pin;await save();pinCtx='player';startPinSet('Set player PIN','Players use this to access their profiles');}
  else if(pinCtx==='player'){APP.settings.playerPin=pin;await save();document.getElementById('phint').style.display='none';access='host';unlockHost();}
  else if(pinCtx==='personal'){const p=gp(pinCtx2);if(p){p.playerPin=pin;await save();}access='player';unlockPlayer();}
  else if(pinCtx==='ch-host'){APP.settings.hostPin=pin;await save();CM();toast('Host PIN updated');}
  else if(pinCtx==='ch-player'){APP.settings.playerPin=pin;await save();CM();toast('Player PIN updated');}
  else if(pinCtx==='ch-personal'){const p=gp(pinCtx2);if(p){p.playerPin=pin;await save();}CM();toast('PIN updated');}
  pinBuf='';updDots();
}

async function quickRebuy(sid,pid){const s=APP.sessions.find(s=>s.id===sid),e=s&&s.entries.find(e=>e.pid===pid);if(!e)return;e.bi.push({a:100,t:'Cash'});await save();RSess();}

OM('Settlement',body,`<button class="btn bs" onclick="CM()">Back</button><button class="btn bp" onclick="closeSess('${sid}')">Close Session</button>`);}
async function closeSess(sid){const s=APP.sessions.find(s=>s.id===sid);if(!s)return;const elapsed=s.startTime?Math.floor((Date.now()-new Date(s.startTime).getTime())/60000):0;s.rake=parseFloat(document.getElementById('fr').value)||0;s.notes=document.getElementById('fn').value;s.status='closed';s.endTime=now();s.duration=elapsed;for(const e of s.entries){const ns=eNS(e);if(ns===null)continue;const p=gp(e.pid);if(!p)continue;p.credit=ns<0?Math.round(ns):0;e.settled=true;const pr=eP(e);if(pr!==null)p.lastRecap={sessId:s.id,profit:Math.round(pr),date:s.date};}if(timerIv){clearInterval(timerIv);timerIv=null;}const rph=elapsed>0?Math.round(s.rake/(elapsed/60)):0;await save();CM();RSess();RDash();toast(`Closed · ${fmtDur(elapsed)} · ${fmt(s.rake)} rake · ${C()}${rph}/hr`);}

function delS(sid){confirm2('Delete permanently?',async()=>{APP.sessions=APP.sessions.filter(s=>s.id!==sid);await save();CM();RHist();toast('Deleted');});}
function exportPDF(sid){const s=APP.sessions.find(s=>s.id===sid);if(!s)return;const{jsPDF}=window.jspdf;const doc=new jsPDF();let y=20;doc.setFontSize(16);doc.setFont('helvetica','bold');doc.text(APP.settings.appName,20,y);y+=10;doc.setFontSize(11);doc.text(`Session — ${fd(s.date)}`,20,y);y+=8;doc.setFontSize(9);doc.setFont('helvetica','normal');doc.text(`Blinds: ${s.blinds||'—'} | Rake: ${fmt(s.rake||0)} | Duration: ${s.duration?fmtDur(s.duration):'—'}`,20,y);y+=10;doc.setFont('helvetica','bold');doc.text('Player',20,y);doc.text('In',80,y);doc.text('Stack',120,y);doc.text('P/L',155,y);y+=6;doc.setFont('helvetica','normal');s.entries.forEach(e=>{const p=gp(e.pid),pr=eP(e);doc.text(p?p.name:e.pid,20,y);doc.text(fmt(eTB(e)),80,y);doc.text(fmt(e.stack||0),120,y);doc.text(pr!==null?fmtS(pr):'—',155,y);y+=6;});y+=4;doc.setFont('helvetica','bold');doc.text('Transfers',20,y);y+=6;doc.setFont('helvetica','normal');const bals=s.entries.map(e=>{const p=gp(e.pid);return{name:p?p.name:e.pid,amt:eNS(e)||0};}).filter(b=>Math.abs(b.amt)>0.5);minXfers(bals.map(b=>({...b}))).forEach(t=>{doc.text(`${t.from} pays ${t.to}: ${fmt(t.a)}`,20,y);y+=6;});doc.save(`5B-Session-${s.date}.pdf`);}
function RPl(){const el=document.getElementById('hvw-players');let players=APP.players.filter(p=>p.on);if(plSearch)players=players.filter(p=>p.name.toLowerCase().includes(plSearch.toLowerCase())||(p.nick||'').toLowerCase().includes(plSearch.toLowerCase()));players=players.sort((a,b)=>{const sa=pStats(a.id),sb=pStats(b.id);if(plSort==='profit')return sb.profit-sa.profit;if(plSort==='wr')return sb.wr-sa.wr;if(plSort==='sessions')return sb.sess-sa.sess;return a.name.localeCompare(b.name);});const inact=APP.players.filter(p=>!p.on);let h=`<div class="fbb mb12"><div class="lbl" style="margin-bottom:0">Players (${APP.players.filter(p=>p.on).length})</div><button class="btn bp bsm" onclick="openNewP()">+ Add</button></div><div class="search-row"><input placeholder="Search..." value="${plSearch}" oninput="plSearch=this.value;RPl()"/><select onchange="plSort=this.value;RPl()"><option value="name" ${plSort==='name'?'selected':''}>Name</option><option value="profit" ${plSort==='profit'?'selected':''}>Profit</option><option value="wr" ${plSort==='wr'?'selected':''}>Win Rate</option><option value="sessions" ${plSort==='sessions'?'selected':''}>Sessions</option></select></div>`;
if(!players.length)h+=`<div class="empty">No players found</div>`;
else{h+=`<div class="card" style="padding:0;overflow:hidden">`;players.forEach(p=>{const st=pStats(p.id),b=p.credit,totalIn=APP.sessions.filter(s=>s.status==='closed').reduce((sum,s)=>{const e=(s.entries||[]).find(e=>e.pid===p.id);return e?sum+eTB(e):sum;},0);h+=`<div class="prow" onclick="openPM('${p.id}')"><div class="fb g8" style="flex:1;min-width:0"><div style="cursor:pointer;position:relative" onclick="document.getElementById('pu-${p.id}').click()"><input type="file" id="pu-${p.id}" accept="image/*" style="display:none" onchange="handlePhotoUpload('${p.id}',this)"/>${ava(p)}<div class="photo-edit-btn" style="position:absolute;bottom:0;right:0;width:14px;height:14px;font-size:8px">✎</div></div><div style="margin-left:8px;min-width:0"><div style="font-size:14px">${p.name}${p.isHost?'<span style="font-size:9px;color:var(--t3);margin-left:4px">HOST</span>':''} ${p.nick?`<span style="color:var(--t2);font-size:11px">${p.nick}</span>`:''}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">${st.sess} sessions · WR ${st.wr}% · Lifetime in: ${fmt(totalIn)}</div></div></div><div style="text-align:right;flex:none;margin-left:8px">${b!==0?`<div class="mn ${b<0?'neg':'pos'}" style="font-size:13px">${fmtS(b)}</div><div style="font-size:9px;color:var(--t3)">${b<0?'owes':'owed'}</div>`:`<div style="font-size:11px;color:var(--t3)">Settled</div>`}</div></div>`;});h+=`</div>`;}
if(inact.length){h+=`<div class="lbl mt20 mb12">Inactive (${inact.length})</div><div class="card" style="padding:0;overflow:hidden">`;inact.forEach(p=>{h+=`<div class="prow" onclick="openPM('${p.id}')" style="opacity:.5"><div class="fb g8">${ava(p)}<div style="font-size:13px;margin-left:8px">${p.name}</div></div><div class="fb g6"><span class="bdg bg-w">Inactive</span><button class="btn bd bxs" onclick="event.stopPropagation();delPlayer('${p.id}')">Delete</button></div></div>`;});h+=`</div>`;}
el.innerHTML=h;}

function openPM(pid){const p=gp(pid);if(!p)return;const st=pStats(pid);const totalIn=APP.sessions.filter(s=>s.status==='closed').reduce((sum,s)=>{const e=(s.entries||[]).find(e=>e.pid===pid);return e?sum+eTB(e):sum;},0);const bOpts=(APP.badgeTypes||[]).map(b=>`<label style="display:flex;align-items:center;gap:6px;margin-bottom:6px;cursor:pointer;font-weight:400"><input type="checkbox" ${(p.badges||[]).includes(b.id)?'checked':''} value="${b.id}" class="badge-cb" style="width:auto"/> ${b.label}</label>`).join('');
OM(p.name,`<div class="g2 mb8"><div class="stat"><div class="slbl">Sessions</div><div class="sval">${st.sess}</div></div><div class="stat"><div class="slbl">Win Rate</div><div class="sval ${st.wr>=50?'pos':'neg'}">${st.wr}%</div></div><div class="stat"><div class="slbl">Lifetime In</div><div class="sval">${fmt(totalIn)}</div></div><div class="stat"><div class="slbl">Total P/L</div><div class="sval ${st.profit>=0?'pos':'neg'}">${fmtS(st.profit)}</div></div><div class="stat"><div class="slbl">Best Night</div><div class="sval pos">${fmt(st.best)}</div></div><div class="stat"><div class="slbl">Avg P/L</div><div class="sval ${st.ap>=0?'pos':'neg'}">${fmtS(st.ap)}</div></div></div><hr>
<div style="text-align:center;margin-bottom:14px"><div class="prof-photo" style="margin:0 auto 8px" onclick="document.getElementById('hpu-${pid}').click()"><div class="photo-edit-btn">&#x270E;</div>${p.photo?`<img src="${p.photo}"/>`:`<span>${p.name[0]}</span>`}</div><input type="file" id="hpu-${pid}" accept="image/*" style="display:none" onchange="handlePhotoUpload('${pid}',this)"/></div>
<div class="fg"><label class="fl">Name</label><input id="ep-n" value="${p.name}"/></div>
<div class="fg"><label class="fl">Nickname</label><input id="ep-nk" value="${p.nick||''}" placeholder="Optional..."/></div>
<div class="fg"><label class="fl">Bio</label><input id="ep-bio" value="${p.bio||''}" placeholder="One liner..."/></div>
<div class="fg"><label class="fl">Credit (negative = owes house)</label><input id="ep-c" type="number" value="${p.credit}" step="1" inputmode="numeric" min="-99999"/></div>
<div class="fg"><label class="fl">Notes</label><input id="ep-no" value="${p.notes||''}" placeholder="..."/></div>
<div class="fg"><label class="fl">Member Since</label><input id="ep-since" type="date" value="${p.since||''}"/></div>
${bOpts?`<div class="fg"><label class="fl">Badges</label>${bOpts}</div>`:''}
<div class="fg"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:400"><input type="checkbox" id="ep-a" ${p.on?'checked':''} style="width:auto;flex:none"/> Active Player</label></div>
<button class="btn bs bsm" onclick="resetPPin('${pid}')">Reset Player PIN</button>`,
`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="saveP('${pid}')">Save</button>`);}

async function saveP(pid){const p=gp(pid);if(!p)return;p.name=document.getElementById('ep-n').value.trim()||p.name;p.nick=document.getElementById('ep-nk').value;p.bio=document.getElementById('ep-bio').value;p.credit=parseFloat(document.getElementById('ep-c').value)||0;p.notes=document.getElementById('ep-no').value;p.since=document.getElementById('ep-since').value;p.on=document.getElementById('ep-a').checked;const cbs=document.querySelectorAll('.badge-cb');if(cbs.length)p.badges=Array.from(cbs).filter(c=>c.checked).map(c=>c.value);await save();CM();RPl();toast('Saved');}
function resetPPin(pid){confirm2("Reset this player's PIN?",async()=>{const p=gp(pid);if(p){p.playerPin='';await save();toast('PIN reset');}});}
function openNewP(){OM('New Player',`<div class="fg"><label class="fl">Name</label><input id="np-n" placeholder="Name..."/></div><div class="fg"><label class="fl">Nickname</label><input id="np-nk" placeholder="Optional..."/></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="addNewP()">Add</button>`);}
async function addNewP(){const name=document.getElementById('np-n').value.trim();if(!name)return;const num=String(APP.players.length+1).padStart(3,'0');APP.players.push({id:`P${num}`,name,nick:document.getElementById('np-nk').value,bio:'',photo:'',isHost:false,credit:0,notes:'',on:true,since:td(),badges:[],playerPin:'',lastRecap:null});await save();CM();RPl();toast(`${name} added`);}
function delPlayer(pid){confirm2('Permanently delete?',async()=>{APP.players=APP.players.filter(p=>p.id!==pid);await save();RPl();toast('Deleted');});}
async function handlePhotoUpload(pid,input){const file=input.files[0];if(!file)return;const r=new FileReader();r.onload=async ev=>{const p=gp(pid);if(p)p.photo=ev.target.result;await save();CM();RPl();toast('Photo updated');};r.readAsDataURL(file);}

function RHist(){const el=document.getElementById('hvw-history');const cl=[...APP.sessions].filter(s=>s.status==='closed').sort((a,b)=>b.date.localeCompare(a.date));let h=`<div class="lbl mb16">History (${cl.length})</div>`;if(!cl.length)h+=`<div class="empty">No sessions yet</div>`;else cl.forEach(s=>{const pot=(s.entries||[]).reduce((sum,e)=>sum+eTB(e),0),rph=s.duration&&s.rake?Math.round(s.rake/(s.duration/60)):0;h+=`<div class="card" style="cursor:pointer" onclick="viewS('${s.id}')"><div class="fbb"><div><div style="font-size:15px;margin-bottom:3px">${fd(s.date)}</div><div style="font-size:11px;color:var(--t2)">${s.blinds||'—'} · ${(s.entries||[]).length} players · ${fmt(pot)} pot</div>${s.duration?`<div style="font-size:10px;color:var(--t3);margin-top:2px">${fmtDur(s.duration)} · ${C()}${rph}/hr</div>`:''}</div><div style="text-align:right;flex:none"><div style="font-size:10px;color:var(--t3)">Rake</div><div class="pos mn">${fmt(s.rake||0)}</div></div></div>${s.notes?`<div style="margin-top:7px;font-size:11px;color:var(--t3)">${s.notes}</div>`:''}</div>`;});el.innerHTML=h;}

function RBook(){
  const el=document.getElementById('hvw-bookings'),up=APP.upcoming;
  let h=`<div class="fbb mb16"><div class="lbl" style="margin-bottom:0">Upcoming Game</div>${up?`<div class="fb g8"><button class="btn bs bsm" onclick="openEditBk()">Edit</button><button class="btn bd bsm" onclick="clearBk()">Clear</button></div>`:`<button class="btn bp bsm" onclick="openNewBk()">Post Game</button>`}</div>`;
  if(!up){h+=`<div class="empty">No game posted</div>`;el.innerHTML=h;return;}
  const conf=up.confirmed||[],inter=up.interested||[],wl=up.waitlist||[];
  let countdown='';
  if(up.date&&up.time){const d=new Date(`${up.date}T${up.time}`),diff=d-Date.now(),days=Math.floor(diff/864e5),hrs=Math.floor((diff%864e5)/3600000);if(diff>0)countdown=`<div style="font-size:12px;color:var(--a);margin-top:5px">${days>0?`${days}d `:''} ${hrs}h away</div>`;}
  h+=`<div class="card mb12"><div style="font-size:17px;margin-bottom:8px">${up.title||'Next Game'}</div>
    <div style="font-size:13px;color:var(--t2);margin-bottom:3px">${fd(up.date)}${up.time?` · ${up.time}`:''}</div>
    ${up.location?`<div style="font-size:13px;color:var(--t2);margin-bottom:3px">${up.location}</div>`:''}
    ${up.blinds?`<div style="font-size:13px;color:var(--t2);margin-bottom:3px">Blinds: ${up.blinds}</div>`:''}
    <div style="font-size:13px;color:var(--t2)">${conf.length} confirmed · ${inter.length} interested · Max ${up.maxPlayers||'?'}</div>
    ${countdown}
    ${up.notes?`<div style="font-size:12px;color:var(--t3);font-weight:400;line-height:1.4;margin-top:8px">${up.notes}</div>`:''}
    <button class="btn bs bsm mt12" onclick="copyCap()">Copy Caption</button>
  </div>`;

  h+=`<div class="fbb mb8"><div class="lbl" style="margin-bottom:0">Confirmed (${conf.length})</div><button class="btn bs bsm" onclick="openAddBk('confirmed')">+ Add</button></div>`;
  if(!conf.length)h+=`<div class="csm" style="font-size:12px;color:var(--t3)">None yet</div>`;
  else{h+=`<div class="card" style="padding:0;overflow:hidden">`;conf.forEach(e=>{const pid=e.pid||e,p=gp(pid),lt=e.leaveTime||'';h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--b)"><div class="fb g8">${ava(p,28)}<div><div style="font-size:13px">${p?p.name:pid}</div>${lt?`<div style="font-size:10px;color:var(--a)">Leaving ${lt}</div>`:''}</div></div><div class="fb g6"><select style="width:110px;font-size:11px;padding:4px 6px" onchange="changeBkStatus('${pid}',this.value)"><option value="confirmed" selected>Confirmed</option><option value="interested">Interested</option><option value="waitlist">Waitlist</option></select><button class="btn bd bxs" onclick="removeBk('${pid}')">&#x2715;</button></div></div>`;});h+=`</div>`;}

  h+=`<div class="fbb mt16 mb8"><div class="lbl" style="margin-bottom:0">Interested (${inter.length})</div><button class="btn bs bsm" onclick="openAddBk('interested')">+ Add</button></div>`;
  if(!inter.length)h+=`<div class="csm" style="font-size:12px;color:var(--t3)">None yet</div>`;
  else{h+=`<div class="card" style="padding:0;overflow:hidden">`;inter.forEach(e=>{const pid=e.pid||e,p=gp(pid),lt=e.leaveTime||'';h+=`<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--b)"><div class="fb g8">${ava(p,28)}<div><div style="font-size:13px">${p?p.name:pid}</div>${lt?`<div style="font-size:10px;color:var(--a)">Leaving ${lt}</div>`:''}<span class="${e.standby?'standby-tag':'maybe-tag'}" style="margin-top:3px;display:inline-block">${e.standby?'On Standby':'Maybe'}</span></div></div><div class="fb g6"><select style="width:110px;font-size:11px;padding:4px 6px" onchange="changeBkStatus('${pid}',this.value)"><option value="confirmed">Confirmed</option><option value="interested" selected>Interested</option><option value="waitlist">Waitlist</option></select><button class="btn bd bxs" onclick="removeBk('${pid}')">&#x2715;</button></div></div>`;});h+=`</div>`;}

  h+=`<div class="fbb mt16 mb8"><div class="lbl" style="margin-bottom:0">Waitlist (${wl.length})</div><button class="btn bs bsm" onclick="openAddBk('waitlist')">+ Add</button></div>`;
  if(!wl.length)h+=`<div class="csm" style="font-size:12px;color:var(--t3)">Waitlist empty</div>`;
  else{h+=`<div class="card" style="padding:0;overflow:hidden">`;wl.forEach((e,i)=>{const pid=e.pid||e,p=gp(pid);const msg=`${p?p.name:'Player'} — spot available${e.callupTime?` from ${e.callupTime}`:''} at ${up.location||'the game'}. Confirm: ${APP.settings.appLink||'[link]'}`;h+=`<div class="wl-item"><div class="wl-num">${i+1}</div>${ava(p,28)}<div style="flex:1;min-width:0;margin-left:6px"><div style="font-size:13px">${p?p.name:pid}</div><span class="${e.standby?'standby-tag':'maybe-tag'}" style="margin-top:3px;display:inline-block">${e.standby?'On Standby':'Maybe'}</span>${e.callupTime?`<div style="font-size:10px;color:var(--g);margin-top:2px">Called up from ${e.callupTime}</div>`:''}</div><div class="fb g6" style="flex:none">${i>0?`<button class="btn bs bxs" onclick="moveWl('${pid}',-1)">&#x2191;</button>`:''} ${i<wl.length-1?`<button class="btn bs bxs" onclick="moveWl('${pid}',1)">&#x2193;</button>`:''} <button class="btn bp bxs" onclick="confirmWl('${pid}')">Confirm</button><button class="btn bs bxs" onclick="copyMsg('${encodeURIComponent(msg)}')">Copy msg</button><button class="btn bd bxs" onclick="removeBk('${pid}')">&#x2715;</button></div></div>`;});h+=`</div>`;}

  const cl=[...APP.sessions].filter(s=>s.status==='closed').sort((a,b)=>a.date.localeCompare(b.date));
  if(cl.length>1){const gaps=[];for(let i=1;i<cl.length;i++){const a=new Date(cl[i-1].date),b=new Date(cl[i].date);gaps.push(Math.round((b-a)/864e5));}const avgGap=Math.round(gaps.reduce((s,g)=>s+g,0)/gaps.length);h+=`<div class="lbl mt20 mb8">Frequency</div><div class="g2"><div class="stat"><div class="slbl">Avg Gap</div><div class="sval">${avgGap} days</div></div><div class="stat"><div class="slbl">Total Sessions</div><div class="sval">${cl.length}</div></div></div>`;}
  el.innerHTML=h;
}

function copyMsg(enc){const msg=decodeURIComponent(enc);navigator.clipboard.writeText(msg).then(()=>toast('Message copied')).catch(()=>toast('Could not copy'));}
function copyCap(){const up=APP.upcoming;if(!up)return;const lines=[APP.settings.appName,`${fd(up.date)}${up.time?` — ${up.time}`:''}`,up.location?`Location: ${up.location}`:'',up.blinds?`Blinds: ${up.blinds}`:'',up.notes||'',``,`Confirm in the app: ${APP.settings.appLink||'[add link in Settings]'}`].filter(l=>l!==undefined&&l!=='');navigator.clipboard.writeText(lines.join('\n')).then(()=>toast('Caption copied')).catch(()=>toast('Could not copy'));}
function openNewBk(){OM('Post Game',`<div class="fg"><label class="fl">Title</label><input id="bk-t" placeholder="Friday Night Poker..."/></div><div class="fg"><label class="fl">Date</label><input id="bk-d" type="date" value="${td()}"/></div><div class="fg"><label class="fl">Time</label><input id="bk-tm" type="time"/></div><div class="fg"><label class="fl">Location</label><input id="bk-loc" placeholder="Address..."/></div><div class="fg"><label class="fl">Blinds</label><input id="bk-bl" placeholder="1/1"/></div><div class="fg"><label class="fl">Max Players</label><input id="bk-max" type="number" value="10" min="1" inputmode="numeric"/></div><div class="fg"><label class="fl">Notes</label><textarea id="bk-n" placeholder="Bring cash..."></textarea></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="saveBk()">Post</button>`);}
async function saveBk(){APP.upcoming={title:document.getElementById('bk-t').value,date:document.getElementById('bk-d').value,time:document.getElementById('bk-tm').value,location:document.getElementById('bk-loc').value,blinds:document.getElementById('bk-bl').value,maxPlayers:parseInt(document.getElementById('bk-max').value)||10,notes:document.getElementById('bk-n').value,confirmed:[],interested:[],waitlist:[]};await save();CM();RBook();toast('Game posted');}
function openEditBk(){const u=APP.upcoming;OM('Edit Game',`<div class="fg"><label class="fl">Title</label><input id="bk-t" value="${u.title||''}"/></div><div class="fg"><label class="fl">Date</label><input id="bk-d" type="date" value="${u.date||''}"/></div><div class="fg"><label class="fl">Time</label><input id="bk-tm" type="time" value="${u.time||''}"/></div><div class="fg"><label class="fl">Location</label><input id="bk-loc" value="${u.location||''}"/></div><div class="fg"><label class="fl">Blinds</label><input id="bk-bl" value="${u.blinds||''}"/></div><div class="fg"><label class="fl">Max Players</label><input id="bk-max" type="number" value="${u.maxPlayers||10}"/></div><div class="fg"><label class="fl">Notes</label><textarea id="bk-n">${u.notes||''}</textarea></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="updateBk()">Save</button>`);}
async function updateBk(){const u=APP.upcoming;u.title=document.getElementById('bk-t').value;u.date=document.getElementById('bk-d').value;u.time=document.getElementById('bk-tm').value;u.location=document.getElementById('bk-loc').value;u.blinds=document.getElementById('bk-bl').value;u.maxPlayers=parseInt(document.getElementById('bk-max').value)||10;u.notes=document.getElementById('bk-n').value;await save();CM();RBook();toast('Updated');}
function clearBk(){confirm2('Clear the upcoming game?',async()=>{APP.upcoming=null;await save();RBook();toast('Cleared');});}
function openAddBk(status){const up=APP.upcoming,taken=new Set([...(up.confirmed||[]).map(e=>e.pid||e),...(up.interested||[]).map(e=>e.pid||e),...(up.waitlist||[]).map(e=>e.pid||e)]);const avail=APP.players.filter(p=>p.on&&!taken.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name));if(!avail.length){toast('All players listed');return;}const lbl=status==='confirmed'?'Confirmed':status==='interested'?'Interested':'Waitlist';OM(`Add to ${lbl}`,`<div class="fg"><label class="fl">Player</label><select id="abk-p">${avail.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div><div class="fg"><label class="fl">Leaving at (optional)</label><input id="abk-lt" type="time"/></div>${status!=='confirmed'?`<div class="fg"><label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-weight:400"><input type="checkbox" id="abk-sb" style="width:auto"/> On Standby — will come if called</label></div>`:''}`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="doAddBk('${status}')">Add</button>`);}
async function doAddBk(status){const pid=document.getElementById('abk-p').value,lt=document.getElementById('abk-lt').value,sb=document.getElementById('abk-sb')?document.getElementById('abk-sb').checked:false;if(!APP.upcoming[status])APP.upcoming[status]=[];APP.upcoming[status].push({pid,leaveTime:lt,standby:sb});await save();CM();RBook();}
async function changeBkStatus(pid,newStatus){const up=APP.upcoming;if(!up)return;let entry=null;['confirmed','interested','waitlist'].forEach(s=>{const idx=(up[s]||[]).findIndex(e=>(e.pid||e)===pid);if(idx>=0){entry=up[s][idx];up[s].splice(idx,1);}});if(!up[newStatus])up[newStatus]=[];up[newStatus].push(entry||{pid,leaveTime:'',standby:false});await save();RBook();}
async function removeBk(pid){const up=APP.upcoming;if(!up)return;['confirmed','interested','waitlist'].forEach(s=>{if(up[s])up[s]=(up[s]||[]).filter(e=>(e.pid||e)!==pid);});await save();RBook();}
async function moveWl(pid,dir){const wl=APP.upcoming.waitlist||[];const i=wl.findIndex(e=>(e.pid||e)===pid);if(i<0)return;const ni=i+dir;if(ni<0||ni>=wl.length)return;[wl[i],wl[ni]]=[wl[ni],wl[i]];await save();RBook();}
async function confirmWl(pid){const up=APP.upcoming;if(!up)return;if((up.confirmed||[]).length>=(up.maxPlayers||10)){toast('Session full');return;}const idx=(up.waitlist||[]).findIndex(e=>(e.pid||e)===pid);if(idx<0)return;const entry=up.waitlist[idx];up.waitlist.splice(idx,1);if(!up.confirmed)up.confirmed=[];up.confirmed.push(entry);await save();RBook();toast('Moved to confirmed');}
function RSett(){document.getElementById('hvw-settings').innerHTML=`<div class="lbl mb16">Settings</div>
<div class="card mb8"><div class="fg"><label class="fl">App Name</label><input id="s-n" value="${APP.settings.appName}"/></div><div class="fg"><label class="fl">Currency</label><input id="s-c" value="${APP.settings.currency||'£'}" style="max-width:80px"/></div><div class="fg"><label class="fl">App Link (for captions)</label><input id="s-lk" value="${APP.settings.appLink||''}" placeholder="https://5bhomegames.netlify.app"/></div><button class="btn bp bsm" onclick="saveSett()">Save</button></div>
<div class="card mb8"><div style="font-size:12px;color:var(--t2);margin-bottom:12px">Change PINs</div><div class="fb g8"><button class="btn bs bsm" onclick="chPin('ch-host')">Host PIN</button><button class="btn bs bsm" onclick="chPin('ch-player')">Player PIN</button></div></div>
<div class="card mb8"><div class="fbb mb12"><div class="lbl" style="margin-bottom:0">Announcements</div><button class="btn bp bsm" onclick="openNewAnn()">+ Add</button></div>${(APP.announcements||[]).length?APP.announcements.map(a=>`<div class="ann-card"><div class="fbb"><div style="font-size:13px;font-weight:400">${a.text}</div><button class="bgh bxs btn" onclick="delAnn('${a.id}')">&#x2715;</button></div><div style="font-size:10px;color:var(--t3);margin-top:5px">${fd(a.date)}</div></div>`).join(''):'<div class="empty" style="padding:12px 0">None</div>'}</div>
<div class="card mb8"><div class="fbb mb12"><div class="lbl" style="margin-bottom:0">Rewards</div><button class="btn bp bsm" onclick="openNewReward()">+ Add</button></div>${(APP.rewards||[]).length?APP.rewards.map(r=>`<div class="ann-card"><div class="fbb"><div><div style="font-size:13px">${r.title}</div>${r.desc?`<div style="font-size:11px;color:var(--t2);margin-top:2px;font-weight:400">${r.desc}</div>`:''}</div><button class="bgh bxs btn" onclick="delReward('${r.id}')">&#x2715;</button></div></div>`).join(''):'<div class="empty" style="padding:12px 0">None</div>'}</div>
<div class="card mb8"><div class="fbb mb12"><div class="lbl" style="margin-bottom:0">Wall of Fame</div><button class="btn bp bsm" onclick="openNewWOF()">+ Add</button></div>${(APP.wallOfFame||[]).length?APP.wallOfFame.map(w=>`<div class="ann-card"><div class="fbb"><div style="font-size:13px;font-weight:400">${w.text}</div><button class="bgh bxs btn" onclick="delWOF('${w.id}')">&#x2715;</button></div><div style="font-size:10px;color:var(--t3);margin-top:5px">${fd(w.date)}</div></div>`).join(''):'<div class="empty" style="padding:12px 0">None</div>'}</div>
<div class="card mb8"><div class="fbb mb12"><div class="lbl" style="margin-bottom:0">Badge Types</div><button class="btn bp bsm" onclick="openNewBadge()">+ Add</button></div>${(APP.badgeTypes||[]).length?APP.badgeTypes.map(b=>`<div class="ann-card"><div class="fbb"><div style="font-size:13px">${b.label}</div><button class="bgh bxs btn" onclick="delBadge('${b.id}')">&#x2715;</button></div></div>`).join(''):'<div class="empty" style="padding:12px 0">Add badge types to award to players</div>'}</div>
<div class="card mb8"><div style="font-size:12px;color:var(--t2);margin-bottom:12px">Reset all credit balances to zero</div><button class="btn bd bsm" onclick="resetBals()">Reset All Balances</button></div>
<div class="card"><div style="font-size:12px;color:var(--t2);margin-bottom:12px">Delete all session history</div><button class="btn bd bsm" onclick="clearHist()">Clear History</button></div>`;}

async function saveSett(){APP.settings.appName=document.getElementById('s-n').value.trim()||APP.settings.appName;APP.settings.currency=document.getElementById('s-c').value||'£';APP.settings.appLink=document.getElementById('s-lk').value;document.getElementById('hbrand').textContent=APP.settings.appName;await save();toast('Settings saved');}
function chPin(ctx){pinCtx=ctx;startPinSet(ctx==='ch-host'?'New host PIN':'New player PIN','');}
function openNewAnn(){OM('New Announcement',`<div class="fg"><label class="fl">Message</label><textarea id="ann-t" placeholder="Game this Friday..."></textarea></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="saveAnn()">Post</button>`);}
async function saveAnn(){const text=document.getElementById('ann-t').value.trim();if(!text)return;if(!APP.announcements)APP.announcements=[];APP.announcements.unshift({id:uid(),text,date:td()});await save();CM();RSett();toast('Posted');}
async function delAnn(id){APP.announcements=APP.announcements.filter(a=>a.id!==id);await save();RSett();}
function openNewReward(){OM('Add Reward',`<div class="fg"><label class="fl">Title</label><input id="rw-t" placeholder="1st Place Prize..."/></div><div class="fg"><label class="fl">Description</label><input id="rw-d" placeholder="AirPods, cash..."/></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="saveReward()">Add</button>`);}
async function saveReward(){const title=document.getElementById('rw-t').value.trim();if(!title)return;if(!APP.rewards)APP.rewards=[];APP.rewards.push({id:uid(),title,desc:document.getElementById('rw-d').value});await save();CM();RSett();toast('Added');}
async function delReward(id){APP.rewards=APP.rewards.filter(r=>r.id!==id);await save();RSett();}
function openNewWOF(){OM('Wall of Fame Entry',`<div class="fg"><label class="fl">Message</label><input id="wf-t" placeholder="Jonathon won 815 in one night..."/></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="saveWOF()">Add</button>`);}
async function saveWOF(){const text=document.getElementById('wf-t').value.trim();if(!text)return;if(!APP.wallOfFame)APP.wallOfFame=[];APP.wallOfFame.unshift({id:uid(),text,date:td()});await save();CM();RSett();toast('Added');}
async function delWOF(id){APP.wallOfFame=APP.wallOfFame.filter(w=>w.id!==id);await save();RSett();}
function openNewBadge(){OM('New Badge Type',`<div class="fg"><label class="fl">Label</label><input id="bg-l" placeholder="First Win, High Roller..."/></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="saveBadge()">Add</button>`);}
async function saveBadge(){const label=document.getElementById('bg-l').value.trim();if(!label)return;if(!APP.badgeTypes)APP.badgeTypes=[];APP.badgeTypes.push({id:uid(),label});await save();CM();RSett();toast('Badge type added');}
async function delBadge(id){APP.badgeTypes=APP.badgeTypes.filter(b=>b.id!==id);await save();RSett();}
function resetBals(){confirm2('Reset all balances to zero?',async()=>{APP.players.forEach(p=>p.credit=0);await save();toast('Reset');});}
function clearHist(){confirm2('Delete all session history?',async()=>{APP.sessions=APP.sessions.filter(s=>s.status==='open');await save();RHist();toast('Cleared');});}

function RPHome(){const el=document.getElementById('pvw-home'),p=gp(myPid);if(!p){el.innerHTML=`<div class="empty">Profile not found</div>`;return;}const st=pStats(myPid);const badges=(p.badges||[]).map(bid=>{const b=(APP.badgeTypes||[]).find(b=>b.id===bid);return b?`<span class="badge-pill">${b.label}</span>`:''}).filter(Boolean).join(' ');const streak=st.streak>1?(st.lastR==='W'?`${st.streak} win streak`:`${st.streak} loss streak`):'';
let h=`<div class="prof-hero"><div class="prof-photo" onclick="document.getElementById('self-photo').click()">${p.photo?`<img src="${p.photo}"/>`:`<span>${p.name[0]}</span>`}<div class="photo-edit-btn">&#x270E;</div></div><input type="file" id="self-photo" accept="image/*" style="display:none" onchange="selfPhoto(this)"/>
<div style="font-size:20px;margin-bottom:3px">${p.name}</div>
${p.nick?`<div style="font-size:13px;color:var(--t2);margin-bottom:3px">${p.nick}</div>`:''}
${p.bio?`<div style="font-size:12px;color:var(--t3);font-weight:400;line-height:1.4;margin-bottom:6px">${p.bio}</div>`:''}
${streak?`<div style="font-size:12px;color:${st.lastR==='W'?'var(--g)':'var(--r)'};margin-bottom:6px">${streak}</div>`:''}
<div style="font-size:10px;color:var(--t3);text-transform:uppercase;letter-spacing:.1em">Member since ${fd(p.since||'2026-03-02')}</div>
${badges?`<div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;justify-content:center">${badges}</div>`:''}
<button class="btn bs bsm mt12" onclick="editMyProfile()">Edit Profile</button></div>`;
if(p.lastRecap){const isWin=p.lastRecap.profit>=0;h+=`<div class="recap-card ${isWin?'':'loss'}"><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--t3);margin-bottom:4px">Last Session — ${fd(p.lastRecap.date)}</div><div style="font-size:18px" class="${isWin?'pos':'neg'}">${fmtS(p.lastRecap.profit)}</div><button class="btn bs bxs mt8" onclick="dismissRecap()">Dismiss</button></div>`;}
h+=`<div class="g3 mb8 mt4"><div class="smini"><div class="smini-v">${st.sess}</div><div class="smini-l">Sessions</div></div><div class="smini"><div class="smini-v ${st.wr>=50?'pos':'neg'}">${st.wr}%</div><div class="smini-l">Win Rate</div></div><div class="smini"><div class="smini-v ${st.profit>=0?'pos':'neg'}">${fmtS(st.profit)}</div><div class="smini-l">Total P/L</div></div></div>`;
if((APP.wallOfFame||[]).length){h+=`<div class="lbl mt16 mb10">Wall of Fame</div>`;APP.wallOfFame.slice(0,3).forEach(w=>{h+=`<div class="ann-card"><div style="font-size:13px;font-weight:400">${w.text}</div><div style="font-size:10px;color:var(--t3);margin-top:5px">${fd(w.date)}</div></div>`;});}
el.innerHTML=h;}
async function dismissRecap(){const p=gp(myPid);if(p){p.lastRecap=null;await save();RPHome();}}
function editMyProfile(){const p=gp(myPid);if(!p)return;OM('Edit Profile',`<div class="fg"><label class="fl">Nickname</label><input id="ep-nk" value="${p.nick||''}" placeholder="Optional..."/></div><div class="fg"><label class="fl">Bio</label><input id="ep-bio" value="${p.bio||''}" placeholder="One liner..."/></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="saveMyP()">Save</button>`);}
async function saveMyP(){const p=gp(myPid);if(!p)return;p.nick=document.getElementById('ep-nk').value;p.bio=document.getElementById('ep-bio').value;await save();CM();RPHome();toast('Saved');}
async function selfPhoto(input){const file=input.files[0];if(!file)return;if(useFB&&stor){try{const ref=stor.ref().child(`players/${myPid}/photo`);await ref.put(file);const url=await ref.getDownloadURL();const p=gp(myPid);if(p)p.photo=url;await save();RPHome();toast('Photo updated');}catch(e){toast('Upload failed');}}else{const r=new FileReader();r.onload=async ev=>{const p=gp(myPid);if(p)p.photo=ev.target.result;await save();RPHome();toast('Photo updated');};r.readAsDataURL(file);}}

function RPNext(){
  const el=document.getElementById('pvw-nextgame'),up=APP.upcoming;
  const aS=APP.sessions.find(s=>s.status==='open');
  let h='';
  if(aS){const pot=(aS.entries||[]).reduce((s,e)=>s+eTB(e),0),cnt=(aS.entries||[]).length,elapsed=aS.startTime?Math.floor((Date.now()-new Date(aS.startTime).getTime())/60000):0;h+=`<div class="live-banner"><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--g);margin-bottom:4px">Game is Live</div><div style="font-size:15px">${cnt} players · ${fmt(pot)} in the pot</div><div style="font-size:11px;color:var(--t2);margin-top:3px">Running for ${fmtDur(elapsed)}</div></div>`;}
  if(!up){h+=`<div class="empty">No game posted yet</div><div style="font-size:12px;color:var(--t3);text-align:center;margin-top:8px">Check back soon</div>`;el.innerHTML=h;return;}
  const conf=up.confirmed||[],inter=up.interested||[],wl=up.waitlist||[];
  const myStatus=myBkStatus(),myEntry=myBkEntry(),myWlPos=wl.findIndex(e=>(e.pid||e)===myPid)+1;
  let countdown='';if(up.date&&up.time){const d=new Date(`${up.date}T${up.time}`),diff=d-Date.now(),days=Math.floor(diff/864e5),hrs=Math.floor((diff%864e5)/3600000);if(diff>0)countdown=`<div style="font-size:13px;color:var(--a);margin-top:6px">${days>0?`${days}d `:''} ${hrs}h away</div>`;}
  h+=`<div class="card mb16"><div style="font-size:18px;margin-bottom:8px">${up.title||'Next Game'}</div><div style="font-size:14px;color:var(--t2);margin-bottom:3px">${fd(up.date)}${up.time?` · ${up.time}`:''}</div>${up.location?`<div style="font-size:14px;color:var(--t2);margin-bottom:3px">${up.location}</div>`:''} ${up.blinds?`<div style="font-size:13px;color:var(--t2);margin-bottom:3px">Blinds: ${up.blinds}</div>`:''}<div style="font-size:13px;color:var(--t2)">${conf.length}/${up.maxPlayers||'?'} confirmed · ${inter.length} interested</div>${countdown}${up.notes?`<div style="font-size:12px;color:var(--t3);margin-top:10px;font-weight:400;line-height:1.5">${up.notes}</div>`:''}</div>`;
  if(!myStatus||myStatus==='waitlist'){h+=`<div style="font-size:13px;color:var(--t2);margin-bottom:10px;text-align:center">Are you coming?</div><div class="rsvp-wrap"><div class="rsvp-btn r-yes ${myStatus==='confirmed'?'sel':''}" onclick="rsvp('confirmed')">Yes</div><div class="rsvp-btn r-maybe ${myStatus==='interested'?'sel':''}" onclick="openRsvpMaybe()">Maybe</div><div class="rsvp-btn r-no" onclick="rsvp('no')">No</div></div>`;if(myStatus==='waitlist')h+=`<div style="text-align:center;font-size:13px;color:var(--a);margin-bottom:16px">You are number ${myWlPos} on the waitlist</div>`;}
  else if(myStatus==='confirmed'){h+=`<div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:var(--rr2);padding:14px;text-align:center;margin-bottom:16px"><div style="font-size:15px;color:var(--g);margin-bottom:4px">You are in</div>${myEntry&&myEntry.leaveTime?`<div style="font-size:12px;color:var(--t2)">Leaving at ${myEntry.leaveTime}</div>`:''}<div class="fb g8" style="justify-content:center;margin-top:10px"><button class="btn bs bsm" onclick="openChLeave()">Set leave time</button><button class="btn bd bsm" onclick="rsvp('cancel')">Cancel spot</button></div></div>`;}
  else if(myStatus==='interested'){h+=`<div style="background:rgba(245,158,11,.08);border:1px solid rgba(245,158,11,.2);border-radius:var(--rr2);padding:14px;text-align:center;margin-bottom:16px"><div style="font-size:15px;color:var(--a);margin-bottom:4px">You are interested</div>${myEntry&&myEntry.standby?`<div style="font-size:12px;color:var(--t2)">On Standby</div>`:''}<div class="fb g8" style="justify-content:center;margin-top:10px"><button class="btn bp bsm" onclick="rsvp('confirmed')">Confirm Yes</button><button class="btn bd bsm" onclick="rsvp('cancel')">Remove</button></div></div>`;}
  if(conf.length){h+=`<div class="lbl mb10">Coming (${conf.length})</div><div class="avatar-row mb16">`;conf.forEach(e=>{const pid=e.pid||e,p=gp(pid);if(p)h+=avaSm(p);});h+=`</div>`;}
  if(inter.length){h+=`<div class="lbl mb10">Interested (${inter.length})</div><div class="avatar-row">`;inter.forEach(e=>{const pid=e.pid||e,p=gp(pid);if(p)h+=avaSm(p);});h+=`</div>`;}
  el.innerHTML=h;
}
async function rsvp(status){if(!APP.upcoming||!myPid)return;const up=APP.upcoming;['confirmed','interested','waitlist'].forEach(s=>{if(up[s])up[s]=(up[s]||[]).filter(e=>(e.pid||e)!==myPid);});if(status==='confirmed'){const isFull=(up.confirmed||[]).length>=(up.maxPlayers||10);if(isFull){if(!up.waitlist)up.waitlist=[];up.waitlist.push({pid:myPid,leaveTime:'',standby:false});toast('Session full — added to waitlist');}else{if(!up.confirmed)up.confirmed=[];up.confirmed.push({pid:myPid,leaveTime:'',standby:false});}}else if(status==='interested'){if(!up.interested)up.interested=[];up.interested.push({pid:myPid,leaveTime:'',standby:false});}await save();RPNext();}
function openRsvpMaybe(){OM('Interested',`<div style="font-size:13px;color:var(--t2);margin-bottom:16px">Let the host know your availability</div><div class="fg"><label style="display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:400"><input type="checkbox" id="rm-sb" style="width:auto"/> I am on standby — I will come if called up</label></div><div class="fg"><label class="fl">Leaving at (optional)</label><input id="rm-lt" type="time" placeholder="e.g. 01:00"/></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" style="background:var(--a);color:#000" onclick="rsvpMaybe()">Mark Interested</button>`);}
async function rsvpMaybe(){if(!APP.upcoming||!myPid)return;const up=APP.upcoming,sb=document.getElementById('rm-sb').checked,lt=document.getElementById('rm-lt').value;['confirmed','interested','waitlist'].forEach(s=>{if(up[s])up[s]=(up[s]||[]).filter(e=>(e.pid||e)!==myPid);});if(!up.interested)up.interested=[];up.interested.push({pid:myPid,leaveTime:lt,standby:sb});await save();CM();RPNext();}
function openChLeave(){OM('Set Leave Time',`<div class="fg"><label class="fl">Leaving at</label><input id="cl-lt" type="time" value="${myBkEntry()?.leaveTime||''}"/></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="saveLeave()">Save</button>`);}
async function saveLeave(){if(!APP.upcoming||!myPid)return;const lt=document.getElementById('cl-lt').value;['confirmed','interested'].forEach(s=>{const e=(APP.upcoming[s]||[]).find(e=>(e.pid||e)===myPid);if(e&&e.pid)e.leaveTime=lt;});await save();CM();RPNext();}

function RPStats(){const el=document.getElementById('pvw-stats'),p=gp(myPid);if(!p){el.innerHTML=`<div class="empty">No data</div>`;return;}const st=pStats(myPid);const recent=APP.sessions.filter(s=>s.status==='closed'&&(s.entries||[]).find(e=>e.pid===myPid)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);let h=`<div class="lbl mb16">My Stats</div><div class="g2 mb8"><div class="stat"><div class="slbl">Sessions</div><div class="sval">${st.sess}</div></div><div class="stat"><div class="slbl">Win Rate</div><div class="sval ${st.wr>=50?'pos':'neg'}">${st.wr}%</div></div><div class="stat"><div class="slbl">Total P/L</div><div class="sval ${st.profit>=0?'pos':'neg'}">${fmtS(st.profit)}</div></div><div class="stat"><div class="slbl">Avg P/L</div><div class="sval ${st.ap>=0?'pos':'neg'}">${fmtS(st.ap)}</div></div><div class="stat"><div class="slbl">Avg Buy-in</div><div class="sval">${fmt(st.ab)}</div></div><div class="stat"><div class="slbl">Best Night</div><div class="sval pos">${fmt(st.best)}</div></div></div>`;if(st.streak>1)h+=`<div class="card mb8" style="text-align:center;border-color:${st.lastR==='W'?'rgba(34,197,94,.3)':'rgba(239,68,68,.3)'}"><div style="font-size:15px;color:${st.lastR==='W'?'var(--g)':'var(--r)'}">${st.streak} ${st.lastR==='W'?'win':'loss'} streak</div></div>`;if(recent.length){h+=`<div class="lbl mt16 mb12">Session History</div>`;recent.forEach(s=>{const e=(s.entries||[]).find(e=>e.pid===myPid);if(!e)return;const pr=eP(e);h+=`<div class="csm fbb"><div><div style="font-size:13px">${fd(s.date)} · ${s.blinds||'—'}</div><div style="font-size:11px;color:var(--t3);margin-top:2px">Bought in: ${fmt(eTB(e))}</div></div><div class="mn ${pr>=0?'pos':'neg'}" style="font-size:15px">${fmtS(pr||0)}</div></div>`;});}el.innerHTML=h;}

function RPNews(){const el=document.getElementById('pvw-news'),anns=APP.announcements||[];let h=`<div class="lbl mb16">Announcements</div>`;if(!anns.length)h+=`<div class="empty">Nothing posted yet</div>`;else anns.forEach(a=>{h+=`<div class="ann-card"><div style="font-size:13px;font-weight:400;line-height:1.4">${a.text}</div><div style="font-size:10px;color:var(--t3);margin-top:7px;letter-spacing:.08em;text-transform:uppercase">${fd(a.date)}</div></div>`;});el.innerHTML=h;}

function RPRew(){const el=document.getElementById('pvw-rewards'),rews=APP.rewards||[];let h=`<div class="lbl mb16">Rewards on Offer</div>`;if(!rews.length)h+=`<div class="empty">Nothing posted yet — check back soon</div>`;else rews.forEach(r=>{h+=`<div class="reward-card"><div style="font-size:16px;margin-bottom:4px">${r.title}</div>${r.desc?`<div style="font-size:13px;color:var(--t2);font-weight:400">${r.desc}</div>`:''}</div>`;});if((APP.wallOfFame||[]).length){h+=`<div class="lbl mt20 mb12">Wall of Fame</div>`;APP.wallOfFame.forEach(w=>{h+=`<div class="ann-card"><div style="font-size:13px;font-weight:400">${w.text}</div><div style="font-size:10px;color:var(--t3);margin-top:5px">${fd(w.date)}</div></div>`;});}el.innerHTML=h;}

async function boot(){initFB();await loadAll();document.getElementById('loading').classList.add('gone');document.getElementById('ptitle').textContent=APP.settings.appName;if(!APP.settings.hostPin){pinCtx='host';startPinSet('Set host PIN','First time — you will set a player PIN after');}else{document.getElementById('plbl').textContent='Enter PIN';}document.getElementById('pin-screen').classList.add('show');}
boot();
</script>
</body>
</html>

let MM=null;

function rewards(pid){let tok=0,rb=0,bo=0;closedAsc().filter(inTerm).forEach(s=>{const q=seatOf(s.id,pid);if(!q)return;const c=calc(q);tok+=c.tok;rb+=c.tok*num(s.tokVal);bo+=num(q.bonus)});
  S.players.filter(x=>x.refBy===pid&&x.refPaid).forEach(x=>{bo+=num(x.refAmt)});return{tok,rb:r2(rb),bo:r2(bo)}}
async function postFeed(text,kind){await DB.set('feed',uid(),{text,kind:kind||'note',ts:Date.now()})}
function av(p,z){z=z||36;return p&&p.photo?`<img class="av" style="width:${z}px;height:${z}px" src="${p.photo}" alt="">`:`<div class="av" style="width:${z}px;height:${z}px;font-size:${Math.round(z*.4)}px">${esc((p?p.name:'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase())}</div>`}
function ring(n,tot){let d='';for(let i=0;i<tot;i++){const a=(-90+i*360/tot)*Math.PI/180,x=150+140*Math.cos(a)-9,y=65+55*Math.sin(a)-9;d+=`<i class="seat ${i<n?'f':''}" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px"></i>`}return `<div class="ring">${d}<div class="rc"><div class="num sm">${n}/${tot}</div><div class="mut">confirmed</div></div></div>`}
const stat=(l,v)=>`<div class="stat"><div class="sv">${v}</div><div class="sl">${l}</div></div>`;

let dirty=false,raf=null;
function sched(){cancelAnimationFrame(raf);raf=requestAnimationFrame(render)}
const mk=v=>HIDE?'•••':fm(v);
function render(){
  const a=$('app');
  if(FATAL){a.innerHTML=`<div class="ctr"><div class="display sm">Database error</div><div class="mut">${esc(FATAL.message||FATAL)}</div><div class="mut">Check the Firestore rules allow the y2_ collections.</div></div>`;return}
  if(!S.ready){a.innerHTML='<div class="ctr"><div class="spin"></div><div class="mut">Loading...</div></div>';return}
  const ae=document.activeElement;
  if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&a.contains(ae)){dirty=true;return}
  dirty=false;
  if(A&&A.role==='player'&&!pl(A.pid)){A=null;saveA()}
  if(!A){a.innerHTML=vLogin();return}
  if(A.role==='host')startHost();
  document.title=ST().appName;
  a.innerHTML=A.role==='host'?vHost():vPlayer();
}

function lpick(id){L={step:'pin',pid:id};sched()}
function lpin(){const p=pl(L.pid);if(!p)return;const a=$('p1').value;

  else{const b=$('p2').value;if(!/^\d{4}$/.test(a))return toast('Use 4 digits');if(a!==b)return toast('PINs do not match');DB.set('players',p.id,{pin:hp(a)});A={role:'player',pid:p.id};saveA();L={step:'home'};V.ptab='home';sched()}}
async function lhost(){const s=S.settings;
  if(s&&s.hostPin){if(hp($('h1').value)===s.hostPin){A={role:'host'};saveA();L={step:'home'};V.tab='dashboard';sched()}else{toast('Wrong PIN');$('h1').value=''}}

async function lreq(){const n=$('rq-n').value.trim();if(!n)return toast('Enter your name');await DB.set('players',uid(),{name:n,pin:null,photo:'',balance:0,archived:false,pending:true,isHouse:false,refBy:$('rq-r').value||'',created:Date.now()});toast('Sent. The host will approve you');lgo('home')}

function vPlayer(){

  const tabs=[['home','Home'],['me','Me']];
  const nav=`<div class="nav"><div class="brand">${esc(st.appName)}</div>${tabs.map(([k,t])=>`<button class="tab ${V.ptab===k?'on':''}" onclick="ptab('${k}')">${t}</button>`).join('')}</div>`;

}
function ptab(k){V.ptab=k;sched();window.scrollTo(0,0)}
function pHome(p){
  const st=ST(),lv=openS(),n=termSess(p.id),t=tierOf(n),nx=nextTier(n),sk=streakOf(p.id),rw=rewards(p.id);let h='';
  h+=`<div class="card"><div class="row">${av(p,52)}<div class="grow"><div class="mut">${esc(TX('hello'))}</div><div class="display sm">${esc(p.name)}</div></div><span class="tag br">${esc(t.name)}</span></div>${nx?`<div class="bar"><i style="width:${Math.min(100,Math.round(n/num(nx.min)*100))}%"></i></div><div class="mut">${num(nx.min)-n} more session${num(nx.min)-n>1?'s':''} this term to reach ${esc(nx.name)}</div>`:'<div class="mut mt">Top tier reached</div>'}${t.perk?`<div class="mut mt">${esc(t.perk)}</div>`:''}</div>`;
  if(lv){const q=seatOf(lv.id,p.id);h+=`<div class="card live"><div class="lbl">${esc(TX('liveTitle'))}</div><div class="display sm">${esc(locName(lv.locId,lv.locName))}</div>`+(q?`<div class="row mt"><div class="grow mut">${esc(st.tokenName)} tonight</div><div class="num">${calc(q).tok}</div></div>`+calc(q).es.filter(e=>e.type==='buyin').sort((a,b)=>a.ts-b.ts).map(e=>`<div class="ln static"><span class="mut">${ft(e.ts)}</span><span>Buy-in ${esc(e.method)}</span><b>${fm(e.amount)}</b></div>`).join(''):`<div class="mut mt">You are not seated yet</div>`)+`</div>`}
  const gs=nextGames().sort((a,b)=>(b.locId===p.homeLoc)-(a.locId===p.homeLoc));
  if(!gs.length)h+=`<div class="card"><div class="empty">No game posted yet</div></div>`;
  gs.forEach(g=>{h+=gameCardP(g,p)});
  h+=`<div class="card"><div class="lbl">${esc(TX('recapTitle'))}</div><div class="stats">${stat('Sessions',n)}${stat(esc(st.tokenName),rw.tok)}${stat(esc(TX('rakebackLabel')),fm(rw.rb))}${stat(esc(TX('bonusLabel')),fm(rw.bo))}</div></div>`;
  h+=`<div class="card"><div class="row"><div class="grow"><div class="lbl">${esc(TX('streakTitle'))}</div><div class="num">${sk}</div><div class="mut">in a row · best ${bestStreak(p.id)}</div></div></div>${num(st.streakTarget)>0?`<div class="dots mt">${Array.from({length:Math.min(12,num(st.streakTarget))},(_,i)=>`<i class="${i<sk?'f':''}"></i>`).join('')}</div><div class="mut mt">${sk>=num(st.streakTarget)?'Unlocked':'At '+num(st.streakTarget)+' in a row'}${st.streakReward?': '+esc(st.streakReward):''}</div>`:''}</div>`;
  h+=standCard(p);
  h+=challCard(p);
  if(num(st.firstBonus)>0&&sessCount(p.id)===0)h+=`<div class="card"><div class="lbl">${esc(TX('firstTitle'))}</div><div>${esc(TX('firstText'))}</div></div>`;
  if(num(st.refBonus)>0){const br=S.players.filter(x=>x.refBy===p.id&&!x.pending);h+=`<div class="card"><div class="lbl">${esc(TX('refTitle'))}</div><div>${esc(TX('refText'))}</div><div class="mut mt">Friends brought: ${br.length}${br.length?' · '+br.map(x=>esc(x.name)).join(', '):''}</div></div>`}
  (st.cards||[]).forEach(c=>{h+=`<div class="card"><div class="lbl">${esc(c.title)}</div><div>${esc(c.text)}</div></div>`});
  h+=`<div class="card"><div class="lbl">${esc(TX('tiersTitle'))}</div>${tiers().map(x=>`<div class="kv"><span>${esc(x.name)}${x.perk?` <span class="mut">· ${esc(x.perk)}</span>`:''}</span><span class="mut">${num(x.min)}+ sessions per term</span></div>`).join('')}</div>`;
  const fe=S.feed.slice().sort((a,b)=>b.ts-a.ts).slice(0,6);
  if(fe.length)h+=`<div class="card"><div class="lbl">${esc(TX('activityTitle'))}</div>${fe.map(e=>`<div class="ln static"><span>${esc(e.text)}</span><span class="mut">${ft(e.ts)}</span></div>`).join('')}</div>`;
  return h;
}
function standCard(p){
  const rows=board(),i=rows.findIndex(x=>x.p.id===p.id),top=rows.slice(0,5);
  let h=`<div class="card"><div class="lbl">${esc(TX('standTitle'))}</div>`;
  if(!rows.length)return h+`<div class="empty">Standings update when a session closes</div></div>`;
  const line=(x,k)=>`<div class="ln static" style="${x.p.id===p.id?'background:var(--s2);border-radius:8px;padding:9px 8px':''}"><div class="row"><span class="mut" style="width:20px">${k+1}</span>${av(x.p,30)}<span>${esc(x.p.name)}${x.p.id===p.id?' (you)':''}</span></div><b>${x.t}</b></div>`;
  top.forEach((x,k)=>{h+=line(x,k)});
  if(i>=5){h+=`<div class="mut center">...</div>`+line(rows[i],i)}
  h+=i<0?`<div class="mut mt">Earn your first ${esc(ST().tokenName.toLowerCase())} to get on the board</div>`:i>0?`<div class="mut mt">${rows[i-1].t-rows[i].t} behind ${esc(rows[i-1].p.name)}</div>`:`<div class="mut mt">You lead the table</div>`;
  return h+'</div>';
}
function gameCardP(g,p){
  const r=rsvpsOf(g.id),mine=r.all.find(x=>x.pid===p.id),open=Math.max(0,g.seats-r.conf.length);
  let h=`<div class="card"><div class="lbl">${mine&&mine.status==='confirmed'?'You are in':'Next game'}</div><div class="display">${esc(locName(g.locId))}</div><div class="mut mt">${fd(g.date)}${g.time?' · '+esc(g.time):''}</div>${g.address?`<div class="mut">${esc(g.address)}</div>`:''}<div class="mut">Blinds ${esc(g.blinds)}</div>${ring(r.conf.length,g.seats)}<div class="center mut">${open?open+' seat'+(open>1?'s':'')+' open':'Table full - join the waitlist'}</div><div class="chips">${r.conf.map(x=>`<span class="chip">${esc(nm(x.pid))}${x.arrive?' · '+esc(x.arrive):''}</span>`).join('')}</div>`;
  if(!mine)h+=`<div class="row mt"><div class="grow"><input type="time" id="arr-${g.id}" value="${esc(p.usualArrive||g.time||'')}" aria-label="Arrival time"></div><button class="btn p" onclick="rsvp('${g.id}','confirmed')">I am in</button></div><button class="btn g w mt" onclick="rsvp('${g.id}','interested')">Maybe</button>`;
  else{const lab={confirmed:'You are in',interested:'Marked as maybe',waitlist:'On the waitlist (#'+(r.wl.findIndex(x=>x.pid===p.id)+1)+')'}[mine.status];
    h+=`<div class="row mt"><div class="grow"><span class="tag br">${lab}</span></div></div><div class="row mt"><div class="grow"><input type="time" value="${esc(mine.arrive||'')}" aria-label="Arrival time" onchange="setArr('${g.id}',this.value)"></div><button class="btn d" onclick="rsvp('${g.id}','out')">Cancel spot</button></div>${mine.status==='interested'?`<button class="btn p w mt" onclick="rsvp('${g.id}','confirmed')">Confirm my seat</button>`:''}`}
  return h+'</div>';
}
async function rsvp(gid,status){
  const g=S.games.find(x=>x.id===gid),p=pl(A.pid);if(!g||!p)return;const id=gid+'_'+p.id,mine=S.rsvps.find(x=>x.id===id);
  if(status==='out'){await DB.del('rsvps',id);return toast('Spot cancelled')}
  const inp=$('arr-'+gid),arrive=inp?inp.value:(mine?mine.arrive||'':'');
  const cnt=S.rsvps.filter(x=>x.gid===gid&&x.status==='confirmed'&&x.pid!==p.id).length;
  let s=status;if(s==='confirmed'&&cnt>=g.seats)s='waitlist';
  await DB.set('rsvps',id,{gid,pid:p.id,status:s,arrive,ts:mine?mine.ts:Date.now()});
  await DB.set('players',p.id,{usualArrive:arrive||p.usualArrive||'',homeLoc:g.locId});
  if(s==='confirmed'&&(!mine||mine.status!=='confirmed'))postFeed(`${p.name} is in for ${locName(g.locId)}, ${fd(g.date)}`,'rsvp');
  toast(s==='waitlist'?'Full - you are on the waitlist':s==='confirmed'?'You are in':'Marked as maybe');
}
async function setArr(gid,v){await DB.set('rsvps',gid+'_'+A.pid,{arrive:v});await DB.set('players',A.pid,{usualArrive:v})}

function challCard(p){
  const c=ST().challenge;if(!c||!c.title)return '';const n=attendedIn(p.id,c.from,c.to),t=num(c.target)||1;
  return `<div class="card"><div class="lbl">${esc(TX('challengeTitle'))}</div><div class="display sm">${esc(c.title)}</div><div class="bar"><i style="width:${Math.min(100,Math.round(n/t*100))}%"></i></div><div class="mut">${n} of ${t}${c.to?' · ends '+fd(c.to):''}</div>${c.reward?`<div class="mut mt">Reward: ${esc(c.reward)}</div>`:''}</div>`;
}
function board(){const rows=S.players.filter(p=>!p.pending&&!p.archived).map(p=>({p,t:termTokens(p.id)})).filter(x=>x.t>0).sort((a,b)=>b.t-a.t);return rows}

function photoUp(inp,pid){const f=inp.files&&inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),z=200;c.width=c.height=z;const m=Math.min(im.width,im.height);c.getContext('2d').drawImage(im,(im.width-m)/2,(im.height-m)/2,m,m,0,0,z,z);DB.set('players',pid,{photo:c.toDataURL('image/jpeg',.7)});toast('Photo saved')};im.src=r.result};r.readAsDataURL(f)}

function hDash(){
  const st=ST(),s=openS(),f=V.dl||'all',t=tstats(f==='all'?null:f);let h='';
  if(!LIVE)h+=`<div class="local">Local mode: data stays on this device. Firebase did not load, so two phones will not sync.</div>`;
  const chip=(k,lab)=>`<button class="chip ${f===k?'on':''}" onclick="setDl('${k}')">${esc(lab)}</button>`;

/* ---- Close and settle ---- */
let CL={sid:null,settle:{}};
function closeM(sid){
  const s=S.sessions.find(x=>x.id===sid),st=ST();if(!s)return;
  const seats=seatsOf(sid).slice().sort((a,b)=>nm(a.pid).localeCompare(nm(b.pid)));CL={sid,settle:{}};
  const capTxt=`Rake cap reference: ${fm(num(st.capBB)*bbOf(s.blinds))} per pot (${num(st.capBB)}bb), ${fm(num(st.incentiveBB)*bbOf(s.blinds))} of it for incentives.`;
  let rows=seats.map(q=>{const c=calc(q);CL.settle[q.pid]=q.settle||'paid';return `<div class="cr"><div class="row"><b class="grow">${esc(nm(q.pid))}</b><span class="mut">in ${fm(c.inn)}${c.cr?' (credit '+fm(c.cr)+')':''}${c.open?' · opening '+fmS(c.open):''}</span></div><input id="ce_${q.pid}" type="number" inputmode="decimal" placeholder="Ending stack" value="${c.end==null?'':c.end}" oninput="cmCalc()" aria-label="Ending stack for ${esc(nm(q.pid))}"><div class="row mt"><div class="grow"><div id="cn_${q.pid}"></div><div class="mut" id="ct_${q.pid}"></div></div><button class="btn sm" id="cb_${q.pid}" onclick="cmTog('${q.pid}')"></button></div></div>`}).join('');
  modal('Settle and close',`<div class="mut mb">${esc(capTxt)}</div>${rows||'<div class="empty">No players</div>'}<div class="fg mt"><label for="cm-rake">Rake collected</label><input id="cm-rake" type="number" inputmode="decimal" value="${num((S.house.find(h=>h.id===sid)||{})._hf)||''}" oninput="cmCalc()"></div><div class="card" id="cm-sum"></div>`,`<button class="btn g" onclick="cm()">Back</button><button class="btn p" onclick="doClose()">Close session</button>`);
  cmCalc();
}
function cmCalc(){
  const sid=CL.sid,st=ST();let sin=0,sout=0;
  seatsOf(sid).forEach(q=>{const c=calc(q),v=$('ce_'+q.pid).value,end=v===''?null:num(v);sin+=c.inn;if(end!=null)sout+=end;
    const first=num(st.firstBonus)>0&&c.inn>0&&sessCount(q.pid)===0,tv=c.tok*num(st.tokenValue);
    const net=end==null?null:end-c.cr+c.open;
    $('cn_'+q.pid).innerHTML=net==null?'<span class="mut">Enter the ending stack</span>':(net>=0?`<b class="pos">Pay ${fm(net)}</b>`:`<b class="neg">Collect ${fm(-net)}</b>`);
    const extra=[];if(c.tok||tv)extra.push(`${c.tok} ${st.tokenName.toLowerCase()}${tv?' = '+fm(tv):''}`);if(first)extra.push('First-session bonus '+fm(st.firstBonus));
    if(net!=null&&(tv||first))extra.push('Total handover '+fm(net+tv+(first?num(st.firstBonus):0)));
    $('ct_'+q.pid).textContent=extra.join(' · ');
    const b=$('cb_'+q.pid),paid=CL.settle[q.pid]==='paid';b.textContent=paid?'Paid':'Carry over';b.style.background=paid?'var(--br)':'transparent';b.style.color=paid?'#07110c':'var(--t)'});
  const rake=num($('cm-rake').value),diff=r2(sin-sout-rake);
  $('cm-sum').innerHTML=`<div class="kv"><span>Total bought in</span><span>${fm(sin)}</span></div><div class="kv"><span>Total ending stacks</span><span>${fm(sout)}</span></div><div class="kv"><span>Rake</span><span>${fm(rake)}</span></div><div class="kv"><span>Unaccounted</span><b class="${diff===0?'pos':'neg'}">${fm(diff)}</b></div>`;
}
function cmTog(pid){CL.settle[pid]=CL.settle[pid]==='paid'?'carry':'paid';cmCalc()}
async function doClose(){
  const sid=CL.sid,s=S.sessions.find(x=>x.id===sid),st=ST(),seats=seatsOf(sid);if(!s)return;
  const miss=seats.filter(q=>$('ce_'+q.pid).value.trim()==='');
  if(miss.length&&!confirm(miss.length+' player(s) have no ending stack. Treat as '+fm(0)+' and close?'))return;
  const j=[];
  for(const q of seats){const end=num($('ce_'+q.pid).value),c=calc(Object.assign({},q,{end})),settle=CL.settle[q.pid]||'paid',first=num(st.firstBonus)>0&&c.inn>0&&sessCount(q.pid)===0;
    j.push(DB.set('seats',q.id,{end,settle,closeNet:r2(c.net),bonus:first?num(st.firstBonus):0}));
    j.push(DB.set('players',q.pid,{balance:settle==='carry'?r2(c.net):0}));
    if(first)j.push(DB.set('bonuses',uid(),{pid:q.pid,sid,amount:num(st.firstBonus),kind:'first',date:s.date,ts:Date.now()}))}
  j.push(DB.set('house',sid,{_hf:num($('cm-rake').value)}));

async function chSet(f,v){await setv('challenge',Object.assign({},ST().challenge,{[f]:f==='target'?num(v):v}))}
async function newTerm(){const n=prompt('Name for the new term',''),st=ST();if(!n)return;if(!confirm('Start "'+n+'" today? Term standings and term totals start again. All-time history is kept.'))return;await setv('term',{name:n,start:td()})}
function hostPin(){const a=prompt('New 4 digit host PIN');if(!a)return;if(!/^\d{4}$/.test(a))return toast('Use 4 digits');setv('hostPin',hp(a)).then(()=>toast('Host PIN updated'))}
function exportData(){const o={};['settings','players','sessions','entries','seats','games','rsvps','house','bonuses','feed'].forEach(k=>{o[k]=S[k]});if(o.settings)delete o.settings.hostPin;const b=new Blob([JSON.stringify(o,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='5b-data-'+td()+'.json';document.body.appendChild(a);a.click();a.remove()}

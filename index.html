function endSess(sid){const s=APP.sessions.find(s=>s.id===sid);if(!s)return;const bals=s.entries.map(e=>{const p=gp(e.pid);return{pid:e.pid,name:p?p.name:e.pid,amt:eNS(e)||0};}).filter(b=>Math.abs(b.amt)>0.5);const xfers=minXfers(bals.map(b=>({...b})));const{sh,fi,shP,fiP}=getFish(s);let body='';if(sh||fi){body+=`<div class="mb12">`;if(sh){const p=gp(sh);body+=`<div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:var(--rr);padding:10px 13px;margin-bottom:6px;display:flex;align-items:center;gap:10px"><div style="font-size:14px;color:var(--g)">Shark</div><div><div style="font-size:13px">${p?p.name:sh}</div><div style="font-size:11px;color:var(--g)">+${fmt(shP)}</div></div></div>`;}if(fi&&fi!==sh){const p=gp(fi);body+=`<div style="background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.2);border-radius:var(--rr);padding:10px 13px;display:flex;align-items:center;gap:10px"><div style="font-size:14px;color:var(--r)">Fish</div><div><div style="font-size:13px">${p?p.name:fi}</div><div style="font-size:11px;color:var(--r)">${fmtS(fiP)}</div></div></div>`;}body+=`</div>`;}body+=`<div class="lbl mb10">Per Player</div>`;s.entries.forEach(e=>{const p=gp(e.pid),ns=eNS(e),pr=eP(e);if(ns===null)return;body+=`<div class="sitem ${ns<0?'sowe':'spaid'}"><div style="flex:1;min-width:0"><div style="font-size:13px">${p?p.name:e.pid}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">In:${fmt(eTB(e))} Stack:${fmt(e.stack||0)} P/L:<span class="${pr>=0?'pos':'neg'}">${fmtS(pr||0)}</span></div></div><div class="mn ${ns<0?'neg':'pos'}" style="font-size:15px;flex:none;margin-left:8px">${fmtS(ns)}</div></div>`;});if(xfers.length){body+=`<div class="lbl mt14 mb10">Transfers</div>`;xfers.forEach(t=>{body+=`<div class="sitem" style="background:var(--bg2)"><div style="font-size:13px"><span class="neg">${t.from}</span> to <span class="pos">${t.to}</span></div><div style="font-size:14px;flex:none">${fmt(t.a)}</div></div>`;});}body+=`<hr><div class="fg"><label class="fl">Rake Collected</label><input id="fr" type="number" min="0" step="1" inputmode="numeric" value="${s.rake||0}"/></div><div class="fg"><label class="fl">Notes</label><input id="fn" value="${s.notes||''}" placeholder="Notes..."/></div>`;OM('Settlement',body,`<button class="btn bs" onclick="CM()">Back</button><button class="btn bp" onclick="closeSess('${sid}')">Close Session</button>`);}
async function closeSess(sid){const s=APP.sessions.find(s=>s.id===sid);if(!s)return;const elapsed=s.startTime?Math.floor((Date.now()-new Date(s.startTime).getTime())/60000):0;s.rake=parseFloat(document.getElementById('fr').value)||0;s.notes=document.getElementById('fn').value;s.status='closed';s.endTime=now();s.duration=elapsed;for(const e of s.entries){const ns=eNS(e);if(ns===null)continue;const p=gp(e.pid);if(!p)continue;p.credit=ns<0?Math.round(ns):0;e.settled=true;const pr=eP(e);if(pr!==null)p.lastRecap={sessId:s.id,profit:Math.round(pr),date:s.date};}const pp=APP.prizePool||{};const contrib=parseFloat(pp.perSession)||20;pp.total=(parseFloat(pp.total)||0)+contrib;if(!pp.contributions)pp.contributions=[];pp.contributions.push({sessId:s.id,amount:contrib,date:s.date});APP.prizePool=pp;if(timerIv){clearInterval(timerIv);timerIv=null;}await save();CM();RSess();RDash();toast(`Session closed - ${fmtDur(elapsed)}`);}
function abandS(sid){confirm2('Abandon session?',async()=>{APP.sessions=APP.sessions.filter(s=>s.id!==sid);if(timerIv){clearInterval(timerIv);timerIv=null;}await save();RSess();toast('Abandoned');});}
function RHist(){const el=document.getElementById('hvw-history');const cl=[...APP.sessions].filter(s=>s.status==='closed').sort((a,b)=>b.date.localeCompare(a.date));let h=`<div class="lbl mb16">History (${cl.length})</div>`;if(!cl.length)h+=`<div class="empty">No sessions yet</div>`;else cl.forEach(s=>{const pot=(s.entries||[]).reduce((sum,e)=>sum+eTB(e),0);h+=`<div class="card" style="cursor:pointer" onclick="viewS('${s.id}')"><div class="fbb"><div><div style="font-size:15px;margin-bottom:3px">${fd(s.date)}</div><div style="font-size:11px;color:var(--t2)">${s.blinds||'—'} · ${(s.entries||[]).length} players · ${fmt(pot)} pot</div>${s.duration?`<div style="font-size:10px;color:var(--t3);margin-top:2px">${fmtDur(s.duration)}</div>`:''}</div><div style="text-align:right;flex:none"><div style="font-size:10px;color:var(--t3)">Rake</div><div class="pos mn">${fmtP(s.rake||0)}</div></div></div>${s.notes?`<div style="margin-top:7px;font-size:11px;color:var(--t3)">${s.notes}</div>`:''}</div>`;});el.innerHTML=h;}
function viewS(sid){const s=APP.sessions.find(s=>s.id===sid);if(!s)return;const dur=s.duration?fmtDur(s.duration):'—';let body=`<div style="font-size:11px;color:var(--t3);margin-bottom:14px">${fd(s.date)} · ${s.blinds||'—'} · ${dur} · Rake:${fmtP(s.rake||0)}</div>`;s.entries.forEach(e=>{const p=gp(e.pid),pr=eP(e),ns=eNS(e);body+=`<div class="fbb" style="padding:8px 0;border-bottom:1px solid var(--b)"><div style="flex:1;min-width:0"><div style="font-size:13px">${p?p.name:e.pid}${e.leaveTime?`<span style="font-size:10px;color:var(--a);margin-left:6px">Left ${e.leaveTime}</span>`:''}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">In:${fmt(eTB(e))} Stack:${fmt(e.stack||0)}</div></div><div style="text-align:right;flex:none;margin-left:8px"><div class="mn ${pr>=0?'pos':'neg'}">${fmtS(pr||0)}</div>${ns!==null&&Math.round(ns)!==Math.round(pr||0)?`<div style="font-size:10px;color:var(--t3)">Net ${fmtS(ns)}</div>`:''}</div></div>`;});if(s.notes)body+=`<div style="margin-top:12px;font-size:11px;color:var(--t3)">${s.notes}</div>`;OM(`Session ${fd(s.date)}`,body,`<button class="btn bs" onclick="CM()">Close</button><button class="btn bs bsm" onclick="openRecap('${s.id}')">Recap</button>${s.status==='closed'?`<button class="btn bs bsm" onclick="reopenS('${s.id}')">Reopen</button>`:''}<button class="btn bd bsm" onclick="delS('${s.id}')">Delete</button>`);}
function reopenS(sid){if(APP.sessions.find(s=>s.status==='open')){toast('Close active session first');return;}const s=APP.sessions.find(s=>s.id===sid);if(!s)return;s.status='open';s.endTime=null;save();CM();hostNav('session');toast('Reopened');}
function delS(sid){confirm2('Delete permanently?',async()=>{APP.sessions=APP.sessions.filter(s=>s.id!==sid);await save();CM();RHist();toast('Deleted');});}
function RPl(){const el=document.getElementById('hvw-players');let players=APP.players.filter(p=>p.on);if(plSearch)players=players.filter(p=>p.name.toLowerCase().includes(plSearch.toLowerCase()));players=players.sort((a,b)=>{const sa=pStats(a.id),sb=pStats(b.id);if(plSort==='profit')return sb.profit-sa.profit;if(plSort==='wr')return sb.wr-sa.wr;if(plSort==='sessions')return sb.sess-sa.sess;return a.name.localeCompare(b.name);});let h=`<div class="fbb mb12"><div class="lbl" style="margin-bottom:0">Players (${APP.players.filter(p=>p.on).length})</div><button class="btn bp bsm" onclick="openNewP()">+ Add</button></div><div class="search-row"><input placeholder="Search..." value="${plSearch}" oninput="plSearch=this.value;RPl()"/><select onchange="plSort=this.value;RPl()"><option value="name" ${plSort==='name'?'selected':''}>Name</option><option value="profit" ${plSort==='profit'?'selected':''}>Profit</option><option value="wr" ${plSort==='wr'?'selected':''}>Win Rate</option><option value="sessions" ${plSort==='sessions'?'selected':''}>Sessions</option></select></div><div style="background:var(--bg1);border:1px solid var(--b);border-radius:var(--rr2);overflow:hidden;margin-bottom:16px">`;
players.forEach(p=>{const st=pStats(p.id);h+=`<div class="prow" onclick="viewP('${p.id}')">${ava(p)}<div style="margin-left:10px;flex:1;min-width:0"><div style="font-size:14px">${p.name}${p.isHost?'<span class="bdg bg-w" style="margin-left:5px;font-size:9px">HOST</span>':''}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">${st.sess} sessions · ${fmtS(st.profit)}</div></div><div style="text-align:right;flex:none">${p.credit!==0?`<div class="mn ${p.credit<0?'neg':'pos'}" style="font-size:13px">${fmtS(p.credit)}</div>`:''}</div></div>`;});
h+=`</div>`;el.innerHTML=h;}
function openNewP(){OM('Add Player',`<div class="fg"><label class="fl">Name</label><input id="np-nm" placeholder="Player name"/></div><div class="fg"><label class="fl">Nickname (optional)</label><input id="np-nk" placeholder="Optional..."/></div><div class="fg"><label class="fl">Opening Credit</label><input id="np-cr" type="number" value="0" step="1" inputmode="numeric"/></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="addP()">Add</button>`);}
async function addP(){const name=document.getElementById('np-nm').value.trim();if(!name)return;const cr=parseFloat(document.getElementById('np-cr').value)||0;APP.players.push({id:'P'+uid(),name,nick:document.getElementById('np-nk').value.trim(),bio:'',isHost:false,credit:cr,notes:'',on:true,since:td(),badges:[],playerPin:'',lastRecap:null});await save();CM();RPl();toast(`${name} added`);}
function viewP(pid){const p=gp(pid);if(!p)return;const st=pStats(pid),tix=ppTickets();OM(p.name,`<div class="g3 mb12"><div class="stat"><div class="slbl">Sessions</div><div class="sval">${st.sess}</div></div><div class="stat"><div class="slbl">Profit</div><div class="sval ${st.profit>=0?'pos':'neg'}">${fmtS(st.profit)}</div></div><div class="stat"><div class="slbl">Win Rate</div><div class="sval">${st.wr}%</div></div></div><div class="fg"><label class="fl">Credit Balance</label><input id="vp-cr" type="number" value="${p.credit}" step="1" inputmode="numeric"/></div><div class="fg"><label class="fl">Notes</label><input id="vp-nt" value="${p.notes||''}" placeholder="Notes..."/></div><div style="font-size:10px;color:var(--t3);margin-top:4px">Prize pool tickets: ${tix[pid]||0}</div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bd bsm" onclick="archiveP('${pid}')">Archive</button><button class="btn bp" onclick="saveP('${pid}')">Save</button>`);}
async function saveP(pid){const p=gp(pid);if(!p)return;p.credit=parseFloat(document.getElementById('vp-cr').value)||0;p.notes=document.getElementById('vp-nt').value;await save();CM();RPl();toast('Saved');}
async function archiveP(pid){confirm2('Archive this player?',async()=>{const p=gp(pid);if(p)p.on=false;await save();CM();RPl();toast('Archived');});}
function RBook(){
  const el=document.getElementById('hvw-bookings');const up=APP.upcoming;const pend=APP.pendingPlayers||[];
  let h=`<div class="lbl mb16">Upcoming Game</div>`;
  if(!up){h+=`<div class="card mb16"><button class="btn bp bfull" onclick="openNewBk()">+ Post Game</button></div>`;}
  else{const base=window.location.href.split('?')[0];const link=`${base}?rsvp=${up.id}`;const conf=up.confirmed||[],inter=up.interested||[],wl=up.waitlist||[];
    h+=`<div class="card mb8"><div class="fbb mb12"><div><div style="font-size:15px;margin-bottom:2px">${up.title||'Next Game'}</div><div style="font-size:12px;color:var(--t2)">${fd(up.date)}${up.time?' · '+up.time:''}</div></div><button class="btn bs bsm" onclick="openEditBk()">Edit</button></div>${up.location?`<div style="font-size:12px;color:var(--t3);margin-bottom:4px">${up.location}</div>`:''}<div style="font-size:12px;color:var(--t2);margin-bottom:12px">${conf.length}/${up.maxPlayers||'?'} confirmed · ${inter.length} interested${wl.length?` · ${wl.length} waitlist`:''}</div><div class="fg"><label class="fl">RSVP Link</label><div class="fb g8"><input value="${link}" readonly style="font-size:11px"/><button class="btn bs bsm" onclick="copyLink('${link}')">Copy Link</button></div></div><button class="btn bp bfull" onclick="copyGameMsg('${up.id}')">📋 Copy Full Message</button></div>`;
    if(conf.length){h+=`<div class="lbl mt16 mb10">Confirmed (${conf.length})</div>`;conf.forEach(e=>{const pid=e.pid||e,p=gp(pid);if(!p)return;h+=`<div class="csm fbb"><div class="fb g8">${avaSm(p)}<div style="font-size:13px">${p.name}</div></div><div class="fb g6"><button class="bgh bxs btn" onclick="removeBk('${pid}')">&#x2715;</button></div></div>`;});}
    if(wl.length){h+=`<div class="lbl mt16 mb10">Waitlist</div>`;wl.forEach((e,i)=>{const pid=e.pid||e,p=gp(pid);if(!p)return;h+=`<div class="csm fbb"><div class="fb g8"><div style="font-size:13px;color:var(--t3);margin-right:8px">${i+1}</div>${avaSm(p)}<div style="margin-left:6px;font-size:13px">${p.name}</div></div><div class="fb g6"><button class="bgh bxs btn" onclick="confirmWl('${pid}')">Confirm</button><button class="bgh bxs btn" onclick="removeBk('${pid}')">&#x2715;</button></div></div>`;});}
    if(pend.length){h+=`<div class="lbl mt16 mb10">New Player Requests (${pend.length})</div>`;pend.forEach(p=>{h+=`<div class="csm fbb"><div><div style="font-size:13px">${p.name}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">${p.status==='yes'?'Wants in':'Said no'}</div></div><div class="fb g8"><button class="btn bs bxs" onclick="approvePending('${p.id}')">Add</button><button class="bgh bxs btn" onclick="dismissPending('${p.id}')">&#x2715;</button></div></div>`;});}
    h+=`<div class="fb g8 mt16"><button class="btn bs bsm" onclick="openAddBk('confirmed')">+ Add Confirmed</button><button class="btn bd bsm" onclick="clearBk()">Clear Game</button></div>`;}
  el.innerHTML=h;
}
function copyLink(link){if(navigator.clipboard){navigator.clipboard.writeText(link).then(()=>toast('Link copied!'));}else{toast('Copy: '+link);}}
function copyGameMsg(gid){
  const up=APP.upcoming;if(!up||up.id!==gid)return;
  const base=window.location.href.split('?')[0];
  const link=`${base}?rsvp=${up.id}`;
  const conf=up.confirmed||[];
  let msg=`🃏 ${up.title||'Game Night'}\n`;
  msg+=`📅 ${fd(up.date)}${up.time?' · '+up.time:''}\n`;
  if(up.location)msg+=`📍 ${up.location}\n`;
  if(up.blinds)msg+=`💰 Blinds: ${up.blinds}\n`;
  msg+=`\n${conf.length}/${up.maxPlayers||'?'} confirmed`;
  if(up.notes)msg+=`\n\n${up.notes}`;
  msg+=`\n\nRSVP here: ${link}`;
  if(navigator.clipboard){navigator.clipboard.writeText(msg).then(()=>toast('Message copied!'));}
  else{OM('Copy This Message',`<textarea style="min-height:180px;font-weight:400;font-size:13px" readonly>${msg}</textarea>`,`<button class="btn bs" onclick="CM()">Close</button>`);}
}
function openNewBk(){const d=new Date();d.setDate(d.getDate()+7);OM('Post Game',`<div class="fg"><label class="fl">Title</label><input id="bk-t" value="Game Night"/></div><div class="fg"><label class="fl">Date</label><input id="bk-d" type="date" value="${d.toISOString().slice(0,10)}"/></div><div class="fg"><label class="fl">Time</label><input id="bk-tm" type="time" value="21:00"/></div><div class="fg"><label class="fl">Location</label><input id="bk-loc" placeholder="Address..."/></div><div class="fg"><label class="fl">Blinds</label><input id="bk-bl" value="${C()}1/${C()}1"/></div><div class="fg"><label class="fl">Max Players</label><input id="bk-max" type="number" value="10" min="2" inputmode="numeric"/></div><div class="fg"><label class="fl">Notes</label><textarea id="bk-n" placeholder="Info for players..."></textarea></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="createBk()">Post</button>`);}
async function createBk(){APP.upcoming={id:uid(),title:document.getElementById('bk-t').value,date:document.getElementById('bk-d').value,time:document.getElementById('bk-tm').value,location:document.getElementById('bk-loc').value,blinds:document.getElementById('bk-bl').value,maxPlayers:parseInt(document.getElementById('bk-max').value)||10,notes:document.getElementById('bk-n').value,confirmed:[],interested:[],waitlist:[]};await save();CM();RBook();toast('Game posted');}
function openEditBk(){const u=APP.upcoming;OM('Edit Game',`<div class="fg"><label class="fl">Title</label><input id="bk-t" value="${u.title||''}"/></div><div class="fg"><label class="fl">Date</label><input id="bk-d" type="date" value="${u.date||''}"/></div><div class="fg"><label class="fl">Time</label><input id="bk-tm" type="time" value="${u.time||''}"/></div><div class="fg"><label class="fl">Location</label><input id="bk-loc" value="${u.location||''}"/></div><div class="fg"><label class="fl">Blinds</label><input id="bk-bl" value="${u.blinds||''}"/></div><div class="fg"><label class="fl">Max Players</label><input id="bk-max" type="number" value="${u.maxPlayers||10}" inputmode="numeric"/></div><div class="fg"><label class="fl">Notes</label><textarea id="bk-n">${u.notes||''}</textarea></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="updateBk()">Save</button>`);}
async function updateBk(){const u=APP.upcoming;u.title=document.getElementById('bk-t').value;u.date=document.getElementById('bk-d').value;u.time=document.getElementById('bk-tm').value;u.location=document.getElementById('bk-loc').value;u.blinds=document.getElementById('bk-bl').value;u.maxPlayers=parseInt(document.getElementById('bk-max').value)||10;u.notes=document.getElementById('bk-n').value;await save();CM();RBook();toast('Updated');}
function clearBk(){confirm2('Clear the upcoming game?',async()=>{APP.upcoming=null;await save();RBook();toast('Cleared');});}
function openAddBk(status){const up=APP.upcoming,taken=new Set([...(up.confirmed||[]).map(e=>e.pid||e),...(up.interested||[]).map(e=>e.pid||e),...(up.waitlist||[]).map(e=>e.pid||e)]);const avail=APP.players.filter(p=>p.on&&!taken.has(p.id)).sort((a,b)=>a.name.localeCompare(b.name));if(!avail.length){toast('All players listed');return;}OM('Add Confirmed',`<div class="fg"><label class="fl">Player</label><select id="abk-p">${avail.map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select></div>`,`<button class="btn bs" onclick="CM()">Cancel</button><button class="btn bp" onclick="doAddBk('${status}')">Add</button>`);}
async function doAddBk(status){const pid=document.getElementById('abk-p').value;if(!APP.upcoming[status])APP.upcoming[status]=[];APP.upcoming[status].push({pid,leaveTime:'',standby:false});await save();CM();RBook();}
async function removeBk(pid){const up=APP.upcoming;if(!up)return;['confirmed','interested','waitlist'].forEach(s=>{if(up[s])up[s]=(up[s]||[]).filter(e=>(e.pid||e)!==pid);});await save();RBook();}
async function confirmWl(pid){const up=APP.upcoming;if(!up)return;if((up.confirmed||[]).length>=(up.maxPlayers||10)){toast('Session full');return;}const idx=(up.waitlist||[]).findIndex(e=>(e.pid||e)===pid);if(idx<0)return;const entry=up.waitlist[idx];up.waitlist.splice(idx,1);if(!up.confirmed)up.confirmed=[];up.confirmed.push(entry);await save();RBook();toast('Moved to confirmed');}
function RPrizeH(){const el=document.getElementById('hvw-prizes');const pp=APP.prizePool||{};const tix=ppTickets();const pot=parseFloat(pp.total)||0;const prog=ppProgress();const excluded=pp.excluded||[];
const allPlayers=APP.players.filter(p=>p.on&&(tix[p.id]||0)>0);const eligibleTix=allPlayers.filter(p=>!excluded.includes(p.id)).reduce((s,p)=>s+(tix[p.id]||0),0);
let h=`<div class="lbl mb16">${pp.season||'Season 1'} — Prize Pool</div><div class="pp-card mb16"><div class="fbb mb8"><div style="font-size:22px">${fmt(pot)}</div><span class="bdg bg-pp">${pp.closed?'Closed':'Active'}</span></div><div class="pp-bar-wrap"><div class="pp-bar" style="width:${prog}%"></div></div><div style="font-size:10px;color:var(--t3);margin-top:4px">${prog}% of target (${fmt((pp.targetSessions||6)*(parseFloat(pp.perSession)||20))})</div></div><div class="g2 mb16"><div class="stat"><div class="slbl">Per Session</div><div class="sval">${fmt(pp.perSession||20)}</div></div><div class="stat"><div class="slbl">Sessions Left</div><div class="sval">${Math.max(0,(pp.targetSessions||6)-(pp.contributions||[]).length)}</div></div></div>`;
h+=`<div class="fbb mb12"><div class="lbl" style="margin-bottom:0">Player Shares</div><div style="font-size:10px;color:var(--t3)">Tap to exclude/include</div></div>`;
if(!allPlayers.length)h+=`<div class="empty">No sessions played yet</div>`;
else allPlayers.sort((a,b)=>(tix[b.id]||0)-(tix[a.id]||0)).forEach(p=>{const t=tix[p.id]||0,isEx=excluded.includes(p.id),share=!isEx&&eligibleTix?Math.round(pot*t/eligibleTix):0,pct=!isEx&&eligibleTix?Math.round(t/eligibleTix*100):0;h+=`<div class="csm fbb" style="${isEx?'opacity:.45':''}" onclick="togglePPExclude('${p.id}')"><div class="fb g8">${avaSm(p)}<div><div style="font-size:13px">${p.name}${isEx?'<span style="font-size:10px;color:var(--r);margin-left:6px">excluded</span>':''}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">${t} session${t!==1?'s':''}${!isEx?` · ${pct}%`:''}</div></div></div><div class="${isEx?'neg':'pos'}" style="font-size:15px">${isEx?'—':fmt(share)}</div></div>`;});
h+=`<hr><div class="lbl mt8 mb12">Settings</div><div class="fg"><label class="fl">Per Session Contribution</label><input id="pp-ps" type="number" value="${pp.perSession||20}" min="0" step="1" inputmode="numeric"/></div><div class="fg"><label class="fl">Target Sessions</label><input id="pp-ts" type="number" value="${pp.targetSessions||6}" min="1" inputmode="numeric"/></div><div class="fg"><label class="fl">Season Name</label><input id="pp-sn" value="${pp.season||'Season 1'}"/></div><div class="fg"><label class="fl">Manual Total Override</label><input id="pp-adj" type="number" value="${pot}" step="1" inputmode="numeric"/></div><div class="fb g8 mb16">${pp.closed?`<button class="btn bs bsm" onclick="reopenPP()">Reopen Pool</button>`:`<button class="btn bd bsm" onclick="closePP()">Close Pool</button>`}<button class="btn bp bsm" onclick="savePP()">Save Settings</button></div>`;
el.innerHTML=h;}

function RPNext(){const el=document.getElementById('pvw-nextgame'),up=APP.upcoming;const aS=APP.sessions.find(s=>s.status==='open');let h='';if(aS){const pot=(aS.entries||[]).reduce((s,e)=>s+eTB(e),0),cnt=(aS.entries||[]).length,elapsed=aS.startTime?Math.floor((Date.now()-new Date(aS.startTime).getTime())/60000):0;h+=`<div class="live-banner"><div style="font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--g);margin-bottom:4px">Game is Live</div><div style="font-size:15px">${cnt} players · ${fmt(pot)} in the pot</div><div style="font-size:11px;color:var(--t2);margin-top:3px">Running for ${fmtDur(elapsed)}</div></div>`;}if(!up){h+=`<div class="empty">No game posted yet</div>`;el.innerHTML=h;return;}const conf=up.confirmed||[],wl=up.waitlist||[];const myStatus=myBkSt();let countdown='';if(up.date&&up.time){const d=new Date(`${up.date}T${up.time}`),diff=d-Date.now(),days=Math.floor(diff/864e5),hrs=Math.floor((diff%864e5)/3600000);if(diff>0)countdown=`<div style="font-size:13px;color:var(--a);margin-top:6px">${days>0?`${days}d `:''} ${hrs}h away</div>`;}h+=`<div class="card mb16"><div style="font-size:18px;margin-bottom:8px">${up.title||'Next Game'}</div><div style="font-size:14px;color:var(--t2);margin-bottom:3px">${fd(up.date)}${up.time?` · ${up.time}`:''}</div>${up.location?`<div style="font-size:14px;color:var(--t2);margin-bottom:3px">${up.location}</div>`:''} ${up.blinds?`<div style="font-size:13px;color:var(--t2);margin-bottom:3px">Blinds: ${up.blinds}</div>`:''}<div style="font-size:13px;color:var(--t2)">${conf.length}/${up.maxPlayers||'?'} confirmed</div>${countdown}${up.notes?`<div style="font-size:12px;color:var(--t3);margin-top:10px;font-weight:400;line-height:1.5">${up.notes}</div>`:''}</div>`;if(!myStatus){h+=`<div style="font-size:13px;color:var(--t2);margin-bottom:10px;text-align:center">Are you coming?</div><div style="display:flex;gap:8px;margin-bottom:16px"><div style="flex:1;padding:14px 8px;border-radius:var(--rr);font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-align:center;cursor:pointer;background:rgba(34,197,94,.1);color:var(--g);border:2px solid rgba(34,197,94,.2)" onclick="rsvpP('confirmed')">Yes</div><div style="flex:1;padding:14px 8px;border-radius:var(--rr);font-size:12px;letter-spacing:.1em;text-transform:uppercase;text-align:center;cursor:pointer;background:rgba(239,68,68,.1);color:var(--r);border:2px solid rgba(239,68,68,.2)" onclick="rsvpP('no')">No</div></div>`;}else if(myStatus==='confirmed'){h+=`<div style="background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:var(--rr2);padding:14px;text-align:center;margin-bottom:16px"><div style="font-size:15px;color:var(--g);margin-bottom:4px">You're in &#10003;</div><button class="btn bd bsm" style="margin-top:8px" onclick="rsvpP('cancel')">Cancel spot</button></div>`;}else if(myStatus==='waitlist'){const wlPos=wl.findIndex(e=>(e.pid||e)===myPid)+1;h+=`<div style="text-align:center;font-size:13px;color:var(--a);margin-bottom:16px">You are number ${wlPos} on the waitlist</div>`;}if(conf.length){h+=`<div class="lbl mb10">Coming (${conf.length})</div><div class="avatar-row mb16">`;conf.forEach(e=>{const pid=e.pid||e,p=gp(pid);if(p)h+=avaSm(p);});h+=`</div>`;}el.innerHTML=h;}
function myBkSt(){if(!APP.upcoming||!myPid)return null;const u=APP.upcoming;if((u.confirmed||[]).find(x=>(x.pid||x)===myPid))return'confirmed';if((u.waitlist||[]).find(x=>(x.pid||x)===myPid))return'waitlist';return null;}
async function rsvpP(status){if(!APP.upcoming||!myPid)return;const u=APP.upcoming;['confirmed','interested','waitlist'].forEach(s=>{if(u[s])u[s]=(u[s]||[]).filter(e=>(e.pid||e)!==myPid);});if(status==='confirmed'){const full=(u.confirmed||[]).length>=(u.maxPlayers||10);if(full){if(!u.waitlist)u.waitlist=[];u.waitlist.push({pid:myPid,leaveTime:'',standby:false});toast('Session full — added to waitlist');}else{if(!u.confirmed)u.confirmed=[];u.confirmed.push({pid:myPid,leaveTime:'',standby:false});}}await save();RPNext();}
function RPStats(){const el=document.getElementById('pvw-stats'),p=gp(myPid);if(!p){el.innerHTML=`<div class="empty">No data</div>`;return;}const st=pStats(myPid);const recent=APP.sessions.filter(s=>s.status==='closed'&&(s.entries||[]).find(e=>e.pid===myPid)).sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8);let h=`<div class="lbl mb16">My Stats</div><div class="g2 mb8"><div class="stat"><div class="slbl">Sessions</div><div class="sval">${st.sess}</div></div><div class="stat"><div class="slbl">Win Rate</div><div class="sval ${st.wr>=50?'pos':'neg'}">${st.wr}%</div></div><div class="stat"><div class="slbl">Total P/L</div><div class="sval ${st.profit>=0?'pos':'neg'}">${fmtS(st.profit)}</div></div><div class="stat"><div class="slbl">Avg P/L</div><div class="sval ${st.ap>=0?'pos':'neg'}">${fmtS(st.ap)}</div></div><div class="stat"><div class="slbl">Avg Buy-in</div><div class="sval">${fmt(st.ab)}</div></div><div class="stat"><div class="slbl">Best Night</div><div class="sval pos">${fmt(st.best)}</div></div></div>`;if(st.streak>1)h+=`<div class="card mb8" style="text-align:center;border-color:${st.lastR==='W'?'rgba(34,197,94,.3)':'rgba(239,68,68,.3)'}"><div style="font-size:15px;color:${st.lastR==='W'?'var(--g)':'var(--r)'}">${st.streak} ${st.lastR==='W'?'win':'loss'} streak</div></div>`;if(recent.length){h+=`<div class="lbl mt16 mb12">Session History</div>`;recent.forEach(s=>{const e=(s.entries||[]).find(e=>e.pid===myPid);if(!e)return;const pr=eP(e);const buys=(e.bi||[]).map((b,i)=>`${i>0?'<br>':''}${b.tm||'--:--'} — ${fmt(b.a)} (${b.t})`).join('');h+=`<div class="csm fbb"><div><div style="font-size:13px">${fd(s.date)} · ${s.blinds||'—'}</div><div style="font-size:11px;color:var(--t3);margin-top:2px;line-height:1.4">${buys}</div></div><div class="mn ${pr>=0?'pos':'neg'}" style="font-size:15px">${fmtS(pr||0)}</div></div>`;});}el.innerHTML=h;}
function RPrizeP(){const el=document.getElementById('pvw-prizes');const pp=APP.prizePool||{};const pot=parseFloat(pp.total)||0;const tix=ppTickets();const totalTix=Object.values(tix).reduce((a,b)=>a+b,0);const myTix=tix[myPid]||0;const myShare=totalTix?Math.round(pot*myTix/totalTix):0;const prog=ppProgress();let h=`<div class="lbl mb16">${pp.season||'Season 1'} — Prize Pool</div><div class="pp-card mb16"><div style="font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:rgba(167,139,250,.6);margin-bottom:6px">Total Pot</div><div style="font-size:32px;color:var(--pp);margin-bottom:12px">${fmt(pot)}</div><div class="pp-bar-wrap"><div class="pp-bar" style="width:${prog}%"></div></div><div style="font-size:10px;color:var(--t3);margin-top:4px">${prog}% of target · ${Math.max(0,(pp.targetSessions||6)-(pp.contributions||[]).length)} sessions left</div></div><div class="card mb16" style="border-color:rgba(139,92,246,.25);background:rgba(139,92,246,.06)"><div style="font-size:11px;color:var(--t3);text-transform:uppercase;letter-spacing:.1em;margin-bottom:6px">Your estimated share</div><div style="font-size:28px;color:var(--pp)">${fmt(myShare)}</div><div style="font-size:11px;color:var(--t3);margin-top:4px">${myTix} session${myTix!==1?'s':''} attended · ${totalTix?Math.round(myTix/Math.max(totalTix,1)*100):0}% of pot</div></div><div class="lbl mb12">All Players</div>`;const excluded=pp.excluded||[];const eligPlayers=APP.players.filter(p=>p.on&&(tix[p.id]||0)>0&&!excluded.includes(p.id));const eligTix=eligPlayers.reduce((s,p)=>s+(tix[p.id]||0),0);const players=APP.players.filter(p=>p.on&&(tix[p.id]||0)>0&&!excluded.includes(p.id)).sort((a,b)=>(tix[b.id]||0)-(tix[a.id]||0));if(!players.length)h+=`<div class="empty">No sessions yet</div>`;else players.forEach(p=>{const t=tix[p.id]||0,share=eligTix?Math.round(pot*t/eligTix):0;h+=`<div class="csm fbb"><div class="fb g8">${avaSm(p)}<div><div style="font-size:13px">${p.name}</div><div style="font-size:10px;color:var(--t3);margin-top:2px">${t} session${t!==1?'s':''}</div></div></div><div class="pos" style="font-size:15px">${fmt(share)}</div></div>`;});el.innerHTML=h;}
function RPRew(){const el=document.getElementById('pvw-rewards'),rews=APP.rewards||[];let h=`<div class="lbl mb16">Rewards on Offer</div>`;if(!rews.length)h+=`<div class="empty">Nothing posted yet</div>`;else rews.forEach(r=>{h+=`<div class="reward-card"><div style="font-size:16px;margin-bottom:4px">${r.title}</div>${r.desc?`<div style="font-size:13px;color:var(--t2);font-weight:400">${r.desc}</div>`:''}</div>`;});if((APP.wallOfFame||[]).length){h+=`<div class="lbl mt20 mb12">Wall of Fame</div>`;APP.wallOfFame.forEach(w=>{h+=`<div class="ann-card"><div style="font-size:13px;font-weight:400">${w.text}</div><div style="font-size:10px;color:var(--t3);margin-top:5px">${fd(w.date)}</div></div>`;});}el.innerHTML=h;}
async function boot(){initFB();await loadAll();document.getElementById('loading').classList.add('gone');document.getElementById('ptitle').textContent=APP.settings.appName;if(checkRSVP())return;if(!APP.settings.hostPin){pinCtx='host';startPinSet('Set host PIN','First time setup');}else{document.getElementById('plbl').textContent='Enter PIN';}document.getElementById('pin-screen').classList.add('show');}
boot();
</script>

const locName=(id,fb)=>{const l=loc(id);return l?l.name:(fb||'Venue')};
const openS=()=>S.sessions.find(s=>s.status==='open');
const closedAsc=()=>S.sessions.filter(s=>s.status==='closed').sort((a,b)=>(a.date+a.created).toString().localeCompare((b.date+b.created).toString()));
function calc(q){const es=ents(q.sid).filter(e=>e.pid===q.pid);let inn=0,cr=0,tok=0;es.forEach(e=>{if(e.type==='buyin'){inn+=num(e.amount);if(e.method==='credit')cr+=num(e.amount)}else if(e.type==='token')tok+=num(e.amount)});const end=q.end==null?null:num(q.end),open=num(q.open);return{es,inn,cr,tok,end,open,net:end==null?null:end-cr+open,profit:end==null?null:end-inn}}
function live(sid){let pot=0,out=0,act=0;const ss=seatsOf(sid);ss.forEach(q=>{const c=calc(q);pot+=c.inn;if(c.end!=null)out+=c.end;else if(c.inn>0)act++});const inPlay=pot-out;return{pot,out,inPlay,n:ss.length,act,avg:act?inPlay/act:0}}
const elapsed=s=>{const m=Math.max(0,Math.floor((Date.now()-(s.created||Date.now()))/60000));return Math.floor(m/60)+'h '+pad(m%60)+'m'};
const attended=(sid,pid)=>{const q=seatOf(sid,pid);return !!q&&calc(q).inn>0};
const sessCount=pid=>closedAsc().filter(s=>attended(s.id,pid)).length;
function streakUnits(){const cl=closedAsc(),b=ST().streakBasis||'night';
  if(b==='session')return cl.map(s=>({k:s.id,ss:[s]}));
  const key=b==='week'?(s=>{const d=new Date(s.date+'T12:00:00');d.setDate(d.getDate()-((d.getDay()+6)%7));return ymd(d)}):(s=>s.date);
  const m=new Map();cl.forEach(s=>{const k=key(s);if(!m.has(k))m.set(k,{k,ss:[]});m.get(k).ss.push(s)});return [...m.values()]}
const inUnit=(u,pid)=>u.ss.some(s=>attended(s.id,pid));
function streakOf(pid){const us=streakUnits().reverse();let n=0;for(const u of us){if(inUnit(u,pid))n++;else break}return n}
const streakWord=()=>({session:'sessions',night:'nights',week:'weeks'})[ST().streakBasis||'night']||'nights';
function bestStreak(pid){let b=0,r=0;streakUnits().forEach(u=>{if(inUnit(u,pid)){r++;if(r>b)b=r}else r=0});return b}
const inTerm=s=>s.date>=ST().term.start;
const termSess=pid=>closedAsc().filter(s=>inTerm(s)&&attended(s.id,pid)).length;
function termTokens(pid){let t=0;closedAsc().filter(inTerm).forEach(s=>{const q=seatOf(s.id,pid);if(q)t+=calc(q).tok});return t}
function attendedIn(pid,from,to){return closedAsc().filter(s=>(!from||s.date>=from)&&(!to||s.date<=to)&&attended(s.id,pid)).length}
function tiers(){return ST().tiers.slice().sort((a,b)=>num(a.min)-num(b.min))}
function tierOf(n){let t=tiers()[0]||{name:'Regular',min:0};tiers().forEach(x=>{if(n>=num(x.min))t=x});return t}
function nextTier(n){return tiers().find(x=>num(x.min)>n)}
function pstats(pid){let n=0,inn=0,prof=0,w=0;closedAsc().forEach(s=>{const q=seatOf(s.id,pid);if(!q)return;const c=calc(q);if(c.inn<=0)return;n++;inn+=c.inn;if(c.profit!=null){prof+=c.profit;if(c.profit>0)w++}});return{n,inn,prof,avg:n?inn/n:0,wr:n?Math.round(w/n*100):0}}
const rsvpsOf=gid=>{const r=S.rsvps.filter(x=>x.gid===gid).sort((a,b)=>(a.ts||0)-(b.ts||0));return{all:r,conf:r.filter(x=>x.status==='confirmed'),int:r.filter(x=>x.status==='interested'),wl:r.filter(x=>x.status==='waitlist')}};
const nextGames=()=>S.games.filter(g=>g.status!=='done'&&g.date>=td()).sort((a,b)=>(a.date+(a.time||'')).localeCompare(b.date+(b.time||'')));
const bbOf=b=>num(String(b||'1/1').split('/').pop())||1;
function refDue(){const st=ST();return S.players.filter(p=>p.refBy&&!p.refPaid&&sessCount(p.id)>=num(st.refSessions)&&pl(p.refBy)).map(p=>({player:p,ref:pl(p.refBy),amount:num(st.refBonus)}))}
function tstats(locId){let n=0,rake=0,hp2=0,exp=0;
  S.sessions.filter(s=>s.status==='closed'&&(!locId||s.locId===locId)).forEach(s=>{n++;const h=S.house.find(x=>x.id===s.id);rake+=num(h&&h._hf);
    seatsOf(s.id).forEach(q=>{const p=pl(q.pid);if(p&&p.isHouse){const c=calc(q);if(c.profit!=null)hp2+=c.profit}})});
  S.entries.filter(e=>e.type==='expense').forEach(e=>{const s=S.sessions.find(x=>x.id===e.sid);const l=e.locId||(s&&s.locId)||'';if(!locId||l===locId)exp+=num(e.amount)});
  return{n,rake,exp,hp:hp2,net:rake-exp+hp2}}
function potStats(){let inc=0,paid=0,wk=0;const w=wkOf(0);
  S.sessions.filter(z=>z.status==='closed'&&inTerm(z)).forEach(z=>{const i=num(z.inc);inc+=i;if(z.date>=w.from&&z.date<=w.to)wk+=i;
    seatsOf(z.id).forEach(q=>{paid+=calc(q).tok*num(z.tokVal)+num(q.bonus)})});
  S.players.forEach(p=>{if(p.refPaid)paid+=num(p.refAmt)});
  return{inc:r2(inc),paid:r2(paid),left:r2(inc-paid),wk:r2(wk)}}
function rewards(pid){let tok=0,rb=0,bo=0;closedAsc().filter(inTerm).forEach(s=>{const q=seatOf(s.id,pid);if(!q)return;const c=calc(q);tok+=c.tok;rb+=c.tok*num(s.tokVal);bo+=num(q.bonus)});
  S.players.filter(x=>x.refBy===pid&&x.refPaid).forEach(x=>{bo+=num(x.refAmt)});return{tok,rb:r2(rb),bo:r2(bo)}}
const wkStart=()=>{const d=new Date();const off=(d.getDay()+6)%7;d.setDate(d.getDate()-off);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())};
const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const foodOf=(wk,pid)=>S.food.find(f=>f.id===wk+'_'+pid);
const foodWk=wk=>S.food.filter(f=>f.wk===wk&&String(f.text||'').trim()).sort((a,b)=>(a.ts||0)-(b.ts||0));
async function postFeed(text,kind){await DB.set('feed',uid(),{text,kind:kind||'note',ts:Date.now()})}
const TCOL=[['#b8733a','#e6b08a','#5a3418'],['#d4a84f','#f1d27a','#6e5420'],['#cfd8dc','#ffffff','#5c6468'],['#8fd3c7','#d6f3ec','#1f4a43'],['#c9a0dc','#ebd6f5','#43274f']];
const tcol=i=>TCOL[i%TCOL.length];
function shield(i,z,dim){const c=tcol(i),ch=Math.min(3,i+1);let p='';for(let k=0;k<ch;k++){const y=46-k*10;p+=`<path d="M20 ${y} L32 ${y-10} L44 ${y}" fill="none" stroke="#07110c" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>`}
  return `<svg width="${z}" height="${Math.round(z*1.125)}" viewBox="0 0 64 72" style="flex:none${dim?';opacity:.5':''}"><path d="M32 3 L58 17 V49 L32 69 L6 49 V17 Z" fill="${c[0]}"/><path d="M32 3 L58 17 V49 L32 69 Z" fill="${c[1]}" fill-opacity=".35"/>${p}</svg>`}
const lock=z=>`<svg width="${z}" height="${Math.round(z*1.1)}" viewBox="0 0 20 22" style="flex:none"><rect x="3" y="9" width="14" height="11" rx="2" fill="var(--br)"/><path d="M6 9V6a4 4 0 0 1 8 0v3" fill="none" stroke="var(--br)" stroke-width="2"/></svg>`;
const gift=z=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" style="flex:none"><rect x="3" y="9" width="18" height="12" rx="2" fill="none" stroke="var(--br)" stroke-width="2"/><path d="M3 13h18M12 9v12" stroke="var(--br)" stroke-width="2"/><path d="M12 9S9.5 4 7.5 5.5 9 9 12 9zm0 0s2.5-5 4.5-3.5S15 9 12 9z" fill="var(--br)"/></svg>`;
const star=z=>`<svg width="${z}" height="${z}" viewBox="0 0 24 24" style="flex:none"><path d="M12 3l2.6 5.8 6.4.7-4.8 4.3 1.4 6.2L12 17l-5.6 3 1.4-6.2L3 9.5l6.4-.7z" fill="none" stroke="var(--br)" stroke-width="2" stroke-linejoin="round"/></svg>`;
const flameIcon=z=>`<svg width="${z}" height="${Math.round(z*1.25)}" viewBox="0 0 24 30" style="flex:none"><path d="M12 1c1 6 8 9 8 18a8 8 0 0 1-16 0c0-3 1-5 3-7 0 3 1 4 3 4 0-6-1-9 2-15z" fill="var(--br)"/></svg>`;
const HSEC={card:'Member card',pot:'Prize pot',food:'Food requests',tiers:'Tier shields and perks',live:'Live session',game:'Next game',recap:'Term recap',streak:'Streak',standings:'Standings',challenge:'Challenge',pills:'Bonus, friend and streak buttons',extra:'Your own cards'};
const homeOrder=()=>{const st=ST(),d=DEFAULTS().home,a=(st.home&&st.home.length?st.home:d).filter(k=>HSEC[k]);d.forEach(k=>{if(a.indexOf(k)<0)a.push(k)});return a};
const homeVisible=()=>{const hid=ST().hideSec||[];return homeOrder().filter(k=>hid.indexOf(k)<0)};
const perkList=t=>String(t&&t.perk||'').split(',').map(x=>x.trim()).filter(Boolean);
const tierIdx=t=>tiers().findIndex(x=>x.name===t.name&&num(x.min)===num(t.min));
function av(p,z){z=z||36;return p&&p.photo?`<img class="av" style="width:${z}px;height:${z}px" src="${p.photo}" alt="">`:`<div class="av" style="width:${z}px;height:${z}px;font-size:${Math.round(z*.4)}px">${esc((p?p.name:'?').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase())}</div>`}
function ring(n,tot){let d='';for(let i=0;i<tot;i++){const a=(-90+i*360/tot)*Math.PI/180,x=150+140*Math.cos(a)-9,y=65+55*Math.sin(a)-9;d+=`<i class="seat ${i<n?'f':''}" style="left:${x.toFixed(0)}px;top:${y.toFixed(0)}px"></i>`}return `<div class="ring">${d}<div class="rc"><div class="num sm">${n}/${tot}</div><div class="mut">confirmed</div></div></div>`}

function render(){
  const a=$('app');
  if(FATAL){a.innerHTML=`<div class="ctr"><div class="display sm">Database error</div><div class="mut">${esc(FATAL.message||FATAL)}</div><div class="mut">Check the Firestore rules allow the y2_ collections.</div></div>`;return}
  if(!S.ready){a.innerHTML='<div class="ctr"><div class="spin"></div><div class="mut">Loading...</div></div>';return}
  const ae=document.activeElement;
  if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&a.contains(ae)){dirty=true;return}

  return `<div class="login">${b}</div>`;

function wkData(off){
  const w=wkOf(off),st=ST(),ss=closedAsc().filter(z=>z.date>=w.from&&z.date<=w.to);
  const tok={},nights=[];let seats=0,pot=0;
  ss.forEach(z=>{let best=null;seatsOf(z.id).forEach(q=>{const c=calc(q);if(c.inn<=0)return;seats++;pot+=c.inn;tok[q.pid]=(tok[q.pid]||0)+c.tok;
      if(c.profit!=null&&(!best||c.profit>best.profit))best={pid:q.pid,profit:c.profit}});
    nights.push({s:z,win:best})});
  const potw=Object.keys(tok).map(pid=>({pid,t:tok[pid]})).sort((a,b)=>b.t-a.t).filter(z=>z.t>0);
  const now=board(),prevTok={};
  closedAsc().filter(z=>inTerm(z)&&z.date<w.from).forEach(z=>{seatsOf(z.id).forEach(q=>{prevTok[q.pid]=(prevTok[q.pid]||0)+calc(q).tok})});
  const prev=Object.keys(prevTok).map(pid=>({pid,t:prevTok[pid]})).filter(z=>z.t>0).sort((a,b)=>b.t-a.t);
  const stand=now.slice(0,5).map((z,i)=>{const pi=prev.findIndex(y=>y.pid===z.p.id);return{p:z.p,t:z.t,mv:pi<0?'new':pi-i}});

}

/* ---- Close and settle ---- */
let CL={sid:null,settle:{}};
const incOf=(rake,manual)=>{if(manual!=null&&String(manual).trim()!=='')return r2(num(manual));const st=ST(),cap=num(st.capBB);return cap>0?r2(num(rake)*num(st.incentiveBB)/cap):0};
function closeM(sid){
  const s=S.sessions.find(x=>x.id===sid),st=ST();if(!s)return;
  const seats=seatsOf(sid).slice().sort((a,b)=>nm(a.pid).localeCompare(nm(b.pid)));CL={sid,settle:{}};
  const capTxt=`Rake cap reference: ${fm(num(st.capBB)*bbOf(s.blinds))} per pot (${num(st.capBB)}bb), ${fm(num(st.incentiveBB)*bbOf(s.blinds))} of it for incentives.`;
  let rows=seats.map(q=>{const c=calc(q);CL.settle[q.pid]=q.settle||'paid';return `<div class="cr"><div class="row"><b class="grow">${esc(nm(q.pid))}</b><span class="mut">in ${fm(c.inn)}${c.cr?' (credit '+fm(c.cr)+')':''}${c.open?' · opening '+fmS(c.open):''}</span></div><input id="ce_${q.pid}" type="number" inputmode="decimal" placeholder="Ending stack" value="${c.end==null?'':c.end}" oninput="cmCalc()" aria-label="Ending stack for ${esc(nm(q.pid))}"><div class="row mt"><div class="grow"><div id="cn_${q.pid}"></div><div class="mut" id="ct_${q.pid}"></div></div><button class="btn sm" id="cb_${q.pid}" onclick="cmTog('${q.pid}')"></button></div></div>`}).join('');
  modal('Settle and close',`<div class="mut mb">${esc(capTxt)}</div>${rows||'<div class="empty">No players</div>'}<div class="fg mt"><label for="cm-rake">Rake collected</label><input id="cm-rake" type="number" inputmode="decimal" value="${num((S.house.find(h=>h.id===sid)||{})._hf)||''}" oninput="cmCalc()"></div><div class="fg"><label for="cm-inc">Going to the prize pot</label><input id="cm-inc" type="number" inputmode="decimal" value="${num(s.inc)||''}" placeholder="Left empty, we work it out from the rake" oninput="cmCalc()"></div><div class="card" id="cm-sum"></div><div class="card" id="cm-pay"></div>`,`<button class="btn g" onclick="cm()">Back</button><button class="btn p" onclick="doClose()">Close session</button>`);
  cmCalc();
}
function cmCalc(){
  const sid=CL.sid,st=ST();let sin=0,sout=0;
  seatsOf(sid).forEach(q=>{const c=calc(q),v=$('ce_'+q.pid).value,end=v===''?null:num(v);sin+=c.inn;if(end!=null)sout+=end;
    const first=num(st.firstBonus)>0&&c.inn>0&&sessCount(q.pid)===0,tv=c.tok*num(st.tokenValue);
    const net=end==null?null:end-c.cr+c.open;
    $('cn_'+q.pid).innerHTML=net==null?'<span class="mut">Enter the ending stack</span>':(net>=0?`<b class="pos">Pay ${fm(net)}</b>`:`<b class="neg">Collect ${fm(-net)}</b>`);
    const extra=[];if(c.tok||tv)extra.push(`${c.tok} ${st.tokenName.toLowerCase()}${tv?' = '+fm(tv):''}`);if(first)extra.push('First-session bonus '+fm(st.firstBonus));
    if(net!=null&&(tv||first))extra.push('Total handover '+fm(net+tv+(first?num(st.firstBonus):0)));
    $('ct_'+q.pid).textContent=extra.join(' · ');
    const b=$('cb_'+q.pid),paid=CL.settle[q.pid]==='paid';b.textContent=paid?'Paid':'Carry over';b.style.background=paid?'var(--br)':'transparent';b.style.color=paid?'#07110c':'var(--t)'});
  $('cm-pay').innerHTML=payHtml(payouts(sid,q=>{const v=$('ce_'+q.pid).value;return v===''?null:num(v)},pid=>CL.settle[pid]==='carry'));
  const rake=num($('cm-rake').value),diff=r2(sin-sout-rake),ic=incOf(rake,$('cm-inc').value);
  $('cm-sum').innerHTML=`<div class="kv"><span>Total bought in</span><span>${fm(sin)}</span></div><div class="kv"><span>Total ending stacks</span><span>${fm(sout)}</span></div><div class="kv"><span>Rake</span><span>${fm(rake)}</span></div><div class="kv"><span>Unaccounted</span><b class="${diff===0?'pos':'neg'}">${fm(diff)}</b></div><div class="kv"><span>To the prize pot</span><b>${fm(ic)}</b></div>`;
}
function cmTog(pid){CL.settle[pid]=CL.settle[pid]==='paid'?'carry':'paid';cmCalc()}
async function doClose(){
  const sid=CL.sid,s=S.sessions.find(x=>x.id===sid),st=ST(),seats=seatsOf(sid);if(!s)return;
  const miss=seats.filter(q=>$('ce_'+q.pid).value.trim()==='');
  if(miss.length&&!confirm(miss.length+' player(s) have no ending stack. Treat as '+fm(0)+' and close?'))return;
  const j=[];
  for(const q of seats){const end=num($('ce_'+q.pid).value),c=calc(Object.assign({},q,{end})),settle=CL.settle[q.pid]||'paid',first=num(st.firstBonus)>0&&c.inn>0&&sessCount(q.pid)===0;
    j.push(DB.set('seats',q.id,{end,settle,closeNet:r2(c.net),bonus:first?num(st.firstBonus):0}));
    j.push(DB.set('players',q.pid,{balance:settle==='carry'?r2(c.net):0}));
    if(first)j.push(DB.set('bonuses',uid(),{pid:q.pid,sid,amount:num(st.firstBonus),kind:'first',date:s.date,ts:Date.now()}))}
  j.push(DB.set('house',sid,{_hf:num($('cm-rake').value)}));
  j.push(DB.set('sessions',sid,{status:'closed',closedAt:Date.now(),tokVal:num(st.tokenValue),inc:incOf(num($('cm-rake').value),$('cm-inc').value)}));
  await Promise.all(j);
  postFeed(`${locName(s.locId,s.locName)} session closed - ${seats.length} players`,'session');
  cm();toast('Session closed');V.tab='dashboard';sched();
}

function hBook(){

  let h=`<div class="row mb"><button class="btn p grow" onclick="gameM()">Post a game</button><button class="btn g grow" onclick="recapM(0)">Weekly recap</button></div>`;

    offerBtn:'What you get'})});
  toast('Filled in');
}
async function bumpOffer(){await setn('offerVer',(num(ST().offerVer)||1)+1);toast('Players will see it on their next open')}
async function txSet(k,v){await DB.set('settings','main',{txt:{[k]:v}})}
async function cSet(i,f,v){const a=(ST().cards||[]).map(c=>Object.assign({},c));a[i][f]=v;await setv('cards',a)}
async function cAdd(){const a=(ST().cards||[]).map(c=>Object.assign({},c));a.push({id:uid(),title:'New card',text:''});await setv('cards',a)}
async function cDel(i){const a=(ST().cards||[]).map(c=>Object.assign({},c));a.splice(i,1);await setv('cards',a)}
async function chSet(f,v){await setv('challenge',Object.assign({},ST().challenge,{[f]:f==='target'?num(v):v}))}
async function newTerm(){const n=prompt('Name for the new term',''),st=ST();if(!n)return;if(!confirm('Start "'+n+'" today? Term standings and term totals start again. All-time history is kept.'))return;await setv('term',{name:n,start:td()})}
function hostPin(){const a=prompt('New 4 digit host PIN');if(!a)return;if(!/^\d{4}$/.test(a))return toast('Use 4 digits');setv('hostPin',hp(a)).then(()=>toast('Host PIN updated'))}
function exportData(){const o={};['settings','players','sessions','entries','seats','games','rsvps','house','bonuses','feed','food'].forEach(k=>{o[k]=S[k]});if(o.settings)delete o.settings.hostPin;const b=new Blob([JSON.stringify(o,null,1)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='5b-data-'+td()+'.json';document.body.appendChild(a);a.click();a.remove()}

sched();
